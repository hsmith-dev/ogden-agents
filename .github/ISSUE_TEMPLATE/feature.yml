name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the problem or the task, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, in plain words.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought of
