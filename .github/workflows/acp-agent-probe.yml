name: ACP agent probe

# TEMPORARY (epic 12, spikes 12.1 and 12.2): can Ogden drive Codex and Grok
# over ACP on each OS? Installs the pinned copies into a temp data folder,
# never signs in, uses no secrets. Prints facts only; removed before review.
on:
  push:
    branches: [spike/12-codex-grok]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.agent }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        agent: [codex, grok]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probe ${{ matrix.agent }}
        run: node scripts/acp-agent-probe.mjs ${{ matrix.agent }}
