name: Antigravity probe

# TEMPORARY (spike 6.1): facts about Google's agy_acp_server (registry
# antigravity-acp 1.3.0) on the CI runners. No secrets, no accounts, no real
# sign-in. Prints facts only; removed before the spike's final commit.
on:
  push:
    branches: [spike/6.1-antigravity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: antigravity-acp probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Windows first (epic 6, E6-R8).
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probe antigravity-acp
        run: node scripts/antigravity-probe.mjs
