name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow reruns the full matrix for the tagged commit before it
  # publishes (release.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  # On main each commit gets its own group, so none is cancelled or dropped while
  # queued; on other refs a newer run cancels the one in progress.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds the bmad-loop wheel when checking the vendored forks.
      # No uv.lock here, so nothing to key a cache on.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      # Re-derives vendor/ from forks.lock (fork tarballs at the locked commits,
      # a rebuilt bmad-loop wheel) and fails naming any file that differs
      # (AD-13). Hashes are LF-normalized, so it passes on Windows checkouts too.
      - name: Check vendored forks
        run: node scripts/vendor-forks.mjs --check
        env:
          # Tag lookups go through the GitHub API; the token lifts the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Typecheck
        run: pnpm typecheck

      # Builds dist/ first, then runs every test, including the packaging guard.
      - name: Test
        run: pnpm test

      - name: Pack
        run: pnpm pack

      # Clean npx install of the tarball in an empty directory; the launcher
      # starts a detached server and exits, which must serve the page and
      # send server.started, and then stop through Quit. With no argument the script uses
      # ogden-agents-<package.json version>.tgz, the file `pnpm pack` just wrote.
      - name: Smoke test the installed package
        run: node scripts/smoke-installed.mjs

      # The same without optional dependencies, as where node-pty can't build
      # (AD-19): the app must still start.
      - name: Smoke test without optional dependencies
        run: node scripts/smoke-installed.mjs --omit-optional

  # The uv archives Ogden Agents may install (story 1.8): re-download each one
  # pinned in packages/adapters/src/toolchain-uv/uv-release.json and check its
  # SHA-256, so a wrong pin fails here and not on a user's computer. The only
  # job that downloads uv; the unit tests use a local fixture server.
  uv-pins:
    name: uv pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check every pinned uv archive
        run: node scripts/check-uv-pins.mjs

  # UI layout in a real browser (architecture Conventions: jsdom doesn't
  # evaluate media queries): sidebar forms and overflow at 1440, 900 and 390
  # px, theme and density switching, and the signed-out launch page.
  e2e:
    name: Browser layout (Linux, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds dist/ first, then runs tests/e2e against the built server.
      - name: Browser tests
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Epic 1's journey in Chromium against the installed package (story 1.12):
  # the packed tarball installed with npx in an empty folder and started by
  # its own `ogden` launcher in background mode, plus the security gate's
  # negative checks and the proof that they fail without the gate. No agent
  # and no uv download; the suite quits the server and leaves no process.
  e2e-installed:
    name: End-to-end, installed (${{ matrix.os }}, Chromium)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds dist/, then writes ogden-agents-<version>.tgz, which the suite installs.
      - name: Pack
        run: pnpm run pack

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end suite against the installed package
        run: pnpm e2e:installed

      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-installed-${{ matrix.os }}
          path: |
            playwright-report/e2e-installed/
            test-results/e2e-installed/
          retention-days: 7
