name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # On main each commit gets its own group, so none is cancelled or dropped while
  # queued; on other refs a newer run cancels the one in progress.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Builds dist/ first, then runs every test, including the packaging guard.
      - name: Test
        run: pnpm test

      - name: Pack
        run: pnpm pack

      # Clean npx install of the tarball in an empty directory; must reach the
      # page and receive server.started. With no argument the script uses
      # ogden-agents-<package.json version>.tgz, the file `pnpm pack` just wrote.
      - name: Smoke test the installed package
        run: node scripts/smoke-installed.mjs
