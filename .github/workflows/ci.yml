name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow reruns the full matrix for the tagged commit before it
  # publishes (release.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  # On main each commit gets its own group, so none is cancelled or dropped while
  # queued; on other refs a newer run cancels the one in progress.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The real-uv tests run BMad Method's tickets.py (story 4.1).
      # No uv.lock here, so nothing to key a cache on.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      # The uv-managed Python the real-uv tests run BMad Method's tickets.py
      # with (story 4.1; TEST_PYTHON in packages/server/test/planning-routes.test.ts).
      # The tests never download it and ignore any preinstalled Python, so this
      # is the only download; it retries once.
      - name: Provision the tests' uv-managed Python
        shell: bash
        run: uv python install 3.12 || (sleep 5 && uv python install 3.12)

      - name: Typecheck
        run: pnpm typecheck

      # Builds dist/ first, then runs every test, including the packaging guard.
      # node-pty's Windows kill() prints an uncaught "AttachConsole failed" when its
      # console list runs after the tree is gone; the terminal always skips that list
      # (stories 9.6 and 3.8), so the line in any test output fails the job.
      # Windows keeps its default shell (pwsh): Git Bash would put its own tools
      # on PATH and set HOME and SHELL for every test, which no user's Windows has.
      - name: Test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pnpm test 2>&1 | tee "$RUNNER_TEMP/test-output.log"
          if grep -q "AttachConsole failed" "$RUNNER_TEMP/test-output.log"; then
            echo "::error::node-pty printed \"AttachConsole failed\" during the tests"
            exit 1
          fi

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'test-output.log'
          pnpm test 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path $log -SimpleMatch -Quiet 'AttachConsole failed') {
            Write-Output '::error::node-pty printed "AttachConsole failed" during the tests'
            exit 1
          }

      - name: Pack
        run: pnpm pack

      # Clean npx install of the tarball in an empty directory; the launcher
      # starts a detached server and exits, which must serve the page and
      # send server.started, and then stop through Quit. With no argument the script uses
      # ogden-agents-<package.json version>.tgz, the file `pnpm pack` just wrote.
      - name: Smoke test the installed package
        run: node scripts/smoke-installed.mjs

      # The same without optional dependencies, as where node-pty can't build
      # (AD-19): the app must still start.
      - name: Smoke test without optional dependencies
        run: node scripts/smoke-installed.mjs --omit-optional

  # Planning provenance (story 10.8): every started plan's baseline_revision is
  # an ancestor of HEAD, and every deferred-work Open items line matches a Log
  # entry. Needs the full history, so the checkout is not shallow.
  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check plan baselines and the deferred-work index
        run: node scripts/check-provenance.mjs

  # The uv archives Ogden Agents may install (story 1.8): re-download each one
  # pinned in packages/adapters/src/toolchain-uv/uv-release.json and check its
  # SHA-256, so a wrong pin fails here and not on a user's computer. The only
  # job that downloads uv; the unit tests use a local fixture server.
  uv-pins:
    name: uv pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check every pinned uv archive
        run: node scripts/check-uv-pins.mjs

  # The pinned upstream BMad Method and bmad-loop (story 4.14, AD-13): each
  # pinned commit's tarball is downloaded and its content hash recomputed
  # through the app's own archive module, and the commit must be in the
  # history of the lock's ref. The only job that downloads them; no test does.
  bmad-pins:
    name: BMad pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the pinned upstream BMad sources
        run: node scripts/bmad-lock.mjs --check
        env:
          # The compare lookups go through the GitHub API; the token lifts the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}

  # The Claude Agent ACP adapter Ogden Agents may install (story 9.3): a real
  # `npm ci` of the pins in packages/adapters/src/setup-claude-code/pins/ into
  # a temp folder, as the app runs it (--ignore-scripts, integrity checked),
  # without and with the Agent SDK's bundled claude, on each OS. The only job
  # that downloads the adapter; the unit and browser tests use a local fixture.
  agent-pins:
    name: Agent pins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the pinned adapter without the bundled claude
        run: node scripts/agent-pins.mjs --check

      - name: Install the pinned adapter with the bundled claude
        run: node scripts/agent-pins.mjs --check --with-binary

  # UI layout in a real browser (architecture Conventions: jsdom doesn't
  # evaluate media queries): sidebar forms and overflow at 1440, 900 and 390
  # px, theme and density switching, and the signed-out launch page.
  e2e:
    name: Browser layout (Linux, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds dist/ first, then runs tests/e2e against the built server.
      - name: Browser tests
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Epic 1's and epic 2's journeys in Chromium against the installed package
  # (stories 1.12 and 2.13): the packed tarball installed with npx in an empty
  # folder and started by its own `ogden` launcher in background mode, plus the
  # security gate's negative checks and the proof that they fail without the
  # gate, and the permission hold and its proof. The agent is the repo's fake
  # ACP agent (OGDEN_AGENTS_CLAUDE_ACP_PATH): no real agent, no agent or uv
  # download. The suite quits every server it starts and leaves no process.
  e2e-installed:
    name: End-to-end, installed (${{ matrix.os }}, Chromium)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds dist/, then writes ogden-agents-<version>.tgz, which the suite installs.
      - name: Pack
        run: pnpm run pack

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end suite against the installed package
        run: pnpm e2e:installed

      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-installed-${{ matrix.os }}
          path: |
            playwright-report/e2e-installed/
            test-results/e2e-installed/
          retention-days: 7
