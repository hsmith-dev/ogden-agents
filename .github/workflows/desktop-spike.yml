# SPIKE 13.1 (TEMPORARY): builds the minimal Tauri shell in apps/desktop-spike/ on every
# OS and architecture, bundles the pinned Node 24 binary and the packed server, installs and
# launches it, and records the answers (findings-<leg> artifacts and the job summary).
# Test builds are uploaded as workflow artifacts only: no secrets, no releases, no publishing.
# The updater dry run signs with a throwaway key generated inside the job.
# Removed from .github/workflows/ before the spike's final commit.
name: Desktop spike (13.1, temporary)

on:
  push:
    branches: [spike/13.1-tauri-desktop]
    paths:
      - apps/desktop-spike/**
      - .github/workflows/desktop-spike.yml

permissions:
  contents: read

concurrency:
  group: desktop-spike-${{ github.sha }}
  cancel-in-progress: false

jobs:
  spike:
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, rust: aarch64-apple-darwin, bundles: 'app,dmg', next: app }
          - { leg: macos-universal, os: macos-latest, target: universal-apple-darwin, rust: 'aarch64-apple-darwin,x86_64-apple-darwin', bundles: 'app,dmg', next: app }
          - { leg: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin, rust: x86_64-apple-darwin, bundles: 'app,dmg', next: app }
          - { leg: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, rust: x86_64-pc-windows-msvc, bundles: 'nsis,msi', next: nsis }
          - { leg: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, rust: aarch64-pc-windows-msvc, bundles: 'nsis,msi', next: nsis }
          - { leg: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, rust: x86_64-unknown-linux-gnu, bundles: 'appimage,deb', next: appimage }
          - { leg: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, rust: aarch64-unknown-linux-gnu, bundles: 'appimage,deb', next: appimage }
    defaults:
      run:
        shell: bash
    env:
      TAURI_CLI: '@tauri-apps/cli@2.12.1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Linux webview and bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb libfuse2 file build-essential
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          {
            echo "DISPLAY=:99"
            # linuxdeploy is itself an AppImage; its strip fails on some ELF files (.relr.dyn).
            echo "APPIMAGE_EXTRACT_AND_RUN=1"
            echo "NO_STRIP=true"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - name: Rust toolchain
        run: rustc --version && cargo --version

      - name: Build and pack Ogden Agents
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm pack
          ls -l ogden-agents-*.tgz

      - name: Stage the bundled Node, npm and the packed server
        run: node apps/desktop-spike/scripts/stage.mjs --target ${{ matrix.target }} --tgz "$(ls ogden-agents-*.tgz | head -1)"

      - name: Icons and a throwaway updater key (generated here, never stored)
        working-directory: apps/desktop-spike
        run: |
          npx --yes "$TAURI_CLI" icon stage/icon-source.png -o src-tauri/icons
          npx --yes "$TAURI_CLI" signer generate --ci -p spike-throwaway -w "$RUNNER_TEMP/spike-updater.key"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/spike-updater.key")"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=spike-throwaway"
          } >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const pub = fs.readFileSync(process.env.RUNNER_TEMP + "/spike-updater.key.pub", "utf8").trim();
            for (const v of ["0.0.1", "0.0.2"]) fs.writeFileSync(process.env.RUNNER_TEMP + "/spike-" + v + ".json", JSON.stringify({ version: v, plugins: { updater: { pubkey: pub } } }));
          '

      - name: Build version N (0.0.1)
        working-directory: apps/desktop-spike
        run: |
          start=$(date +%s)
          npx --yes "$TAURI_CLI" build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/spike-0.0.1.json"
          echo "build N took $(( $(date +%s) - start )) s"
          rm -rf "$RUNNER_TEMP/bundle-n" && cp -R src-tauri/target/${{ matrix.target }}/release/bundle "$RUNNER_TEMP/bundle-n"
          find "$RUNNER_TEMP/bundle-n" -maxdepth 2 -exec ls -ld {} \;

      - name: Build version N+1 (0.0.2) for the updater dry run
        working-directory: apps/desktop-spike
        run: |
          npx --yes "$TAURI_CLI" build --target ${{ matrix.target }} --bundles ${{ matrix.next }} --config "$RUNNER_TEMP/spike-0.0.2.json"
          rm -rf "$RUNNER_TEMP/bundle-n1" && cp -R src-tauri/target/${{ matrix.target }}/release/bundle "$RUNNER_TEMP/bundle-n1"

      - name: Install, launch, measure, quit, update
        timeout-minutes: 30
        env:
          SPIKE_WORK: ${{ runner.temp }}/spike-work
        run: |
          node apps/desktop-spike/scripts/harness.mjs --leg ${{ matrix.leg }} --target ${{ matrix.target }} \
            --bundle "$RUNNER_TEMP/bundle-n" --bundle-next "$RUNNER_TEMP/bundle-n1" \
            --stage apps/desktop-spike/stage --out "$RUNNER_TEMP/findings-${{ matrix.leg }}.json"
          cp apps/desktop-spike/stage/stage-report.json "$RUNNER_TEMP/stage-report-${{ matrix.leg }}.json"

      - name: Upload the test build (version N, unsigned)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ogden-desktop-spike-${{ matrix.leg }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/bundle-n/dmg/*.dmg
            ${{ runner.temp }}/bundle-n/nsis/*.exe
            ${{ runner.temp }}/bundle-n/msi/*.msi
            ${{ runner.temp }}/bundle-n/appimage/*.AppImage
            ${{ runner.temp }}/bundle-n/deb/*.deb

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: findings-${{ matrix.leg }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/findings-${{ matrix.leg }}.json
            ${{ runner.temp }}/stage-report-${{ matrix.leg }}.json
            apps/desktop-spike/src-tauri/Cargo.lock
            ${{ runner.temp }}/spike-work/**/report.jsonl
            ${{ runner.temp }}/spike-work/**/grandchild.jsonl
            ${{ runner.temp }}/spike-work/**/stdio.log
            ${{ runner.temp }}/spike-work/**/data/logs/*.log
