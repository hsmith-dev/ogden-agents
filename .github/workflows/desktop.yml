name: Desktop

# The Ogden Agents desktop app (epic 13): a Tauri shell with a bundled Node. Builds the unsigned
# macOS and Windows apps from the packed server and smoke-tests each one headlessly: it starts,
# the window loads the server's page, the tab exchange happens, and quitting leaves no `ogden-node`
# process. Test builds are workflow artifacts only: no secrets, no releases.
# Linux is out of scope for now (the code stays portable; no Linux job runs).
#
# Lanes (story 13.3): the pinned Node check runs in ci.yml (job `Desktop Node pins`). The `app`
# job below is the shell and runtime lane (stage, build, smoke). The upgrade lane (13.6) and the
# packaging lane (13.8: dmg, NSIS) add their own named jobs here.
#
# Runs on pull requests and pushes that touch the desktop app, and on demand. Test builds are
# signed (for the updater) only with a throwaway key generated inside the job, never a stored one.

on:
  push:
    branches: [main]
    paths:
      - packages/desktop/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - packages/desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TAURI_CLI: '@tauri-apps/cli@2.12.1'
  # Matches packages/desktop/src-tauri/rust-toolchain.toml.
  RUST_VERSION: 1.99.0

jobs:
  # Runtime lane (story 13.4): the pinned, SHA-256-checked Node, its npm and the packed server with
  # production dependencies, staged for each target on a native runner (native modules do not
  # cross-build), then run with ONLY the staged Node on PATH: the server starts through the
  # launcher's --json mode, serves the page, exchanges a launch code and quits, and the staged npm
  # installs a fixture package. No Rust build here; the `app` job below builds the shell.
  runtime:
    name: Runtime (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: macos-universal, os: macos-latest, target: universal-apple-darwin }
          - { leg: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { leg: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Build and pack Ogden Agents
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm pack

      - name: Stage the bundled Node, npm and the packed server
        run: node packages/desktop/scripts/stage.mjs --target ${{ matrix.target }} --tgz "$(ls ogden-agents-*.tgz | head -1)"

      - name: Run the staged server with only the staged Node on PATH
        run: node packages/desktop/scripts/verify-stage.mjs --target ${{ matrix.target }}

      - name: Upload the staging report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-stage-report-${{ matrix.leg }}
          retention-days: 14
          if-no-files-found: warn
          path: packages/desktop/stage/stage-report.json

  app:
    name: App (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, bundles: app }
          - { leg: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Build and pack Ogden Agents
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm pack
          ls -l ogden-agents-*.tgz

      - name: Stage the bundled Node, npm and the packed server
        run: node packages/desktop/scripts/stage.mjs --target ${{ matrix.target }} --tgz "$(ls ogden-agents-*.tgz | head -1)"

      - name: Icons
        working-directory: packages/desktop
        run: npx --yes "$TAURI_CLI" icon stage/icon-source.png -o src-tauri/icons

      - name: Build the app (unsigned)
        working-directory: packages/desktop
        run: npx --yes "$TAURI_CLI" build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Locate the app (macOS)
        if: runner.os == 'macOS'
        run: echo "APP_PATH=$PWD/packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Ogden Agents.app" >> "$GITHUB_ENV"

      - name: Install the app silently (Windows)
        if: runner.os == 'Windows'
        run: |
          installer="$(ls packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe | head -1)"
          exe="$(node packages/desktop/scripts/install-nsis.mjs "$(cygpath -w "$installer")" "$RUNNER_TEMP\\ogden-installed" | tail -1)"
          echo "APP_PATH=$exe" >> "$GITHUB_ENV"

      - name: Smoke test
        run: node packages/desktop/scripts/smoke.mjs --app "$APP_PATH"

      # A second launch, quit, an attached npm server, a busy quit, a killed shell (story 13.5).
      - name: Lifecycle test
        run: node packages/desktop/scripts/lifecycle.mjs --target ${{ matrix.target }} --app "$APP_PATH"

      - name: Upload the test build (unsigned)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ogden-desktop-${{ matrix.leg }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/Cargo.lock
