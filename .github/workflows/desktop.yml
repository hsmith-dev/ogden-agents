name: Desktop

# The Ogden Agents desktop app (epic 13): a Tauri shell with a bundled Node. Builds the unsigned
# macOS and Windows apps from the packed server and smoke-tests each one headlessly: it starts,
# the window loads the server's page, the tab exchange happens, and quitting leaves no `ogden-node`
# process. Test builds are workflow artifacts only: no secrets, no releases.
# Linux is out of scope for now (the code stays portable; no Linux job runs).
#
# Lanes (story 13.3): the pinned Node check runs in ci.yml (job `Desktop Node pins`). The `app`
# job below is the shell and runtime lane (stage, build, smoke). The upgrade lane (13.6) and the
# packaging lane (13.8: dmg, NSIS) add their own named jobs here.
#
# Runs on pull requests and pushes that touch the desktop app, and on demand. Test builds are
# signed (for the updater) only with a throwaway key generated inside the job, never a stored one.

on:
  push:
    branches: [main]
    paths:
      - packages/desktop/**
      - .github/workflows/desktop.yml
      - .github/actions/desktop-build/**
  pull_request:
    paths:
      - packages/desktop/**
      - .github/workflows/desktop.yml
      - .github/actions/desktop-build/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Runtime lane (story 13.4): the pinned, SHA-256-checked Node, its npm and the packed server with
  # production dependencies, staged for each target on a native runner (native modules do not
  # cross-build), then run with ONLY the staged Node on PATH: the server starts through the
  # launcher's --json mode, serves the page, exchanges a launch code and quits, and the staged npm
  # installs a fixture package. No Rust build here; the `app` job below builds the shell.
  runtime:
    name: Runtime (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: macos-universal, os: macos-latest, target: universal-apple-darwin }
          - { leg: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { leg: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Build and pack Ogden Agents
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm pack

      - name: Stage the bundled Node, npm and the packed server
        run: node packages/desktop/scripts/stage.mjs --target ${{ matrix.target }} --tgz "$(ls ogden-agents-*.tgz | head -1)"

      - name: Run the staged server with only the staged Node on PATH
        run: node packages/desktop/scripts/verify-stage.mjs --target ${{ matrix.target }}

      - name: Upload the staging report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-stage-report-${{ matrix.leg }}
          retention-days: 14
          if-no-files-found: warn
          path: packages/desktop/stage/stage-report.json

  # Shell and packaging lanes (stories 13.2, 13.5, 13.8): build the unsigned app and its installer
  # for each target, check the artifacts (an installer, a `.sig` for each updater artifact, both
  # architectures in the universal macOS app), install it the way a user does (a mounted .dmg, a
  # silent NSIS install) and run the smoke and lifecycle tests against it. Test builds are signed
  # for the updater only with a throwaway key generated in the job, never a stored one.
  app:
    name: App (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: macos-universal, os: macos-latest, target: universal-apple-darwin, rust: 'aarch64-apple-darwin,x86_64-apple-darwin', bundles: 'app,dmg' }
          - { leg: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, rust: x86_64-pc-windows-msvc, bundles: nsis }
          - { leg: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, rust: aarch64-pc-windows-msvc, bundles: nsis }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Stage, build, sign with a throwaway key and check the artifacts: the same steps a release
      # runs (story 13.9), with `signing: test`.
      - uses: ./.github/actions/desktop-build
        with:
          target: ${{ matrix.target }}
          rust: ${{ matrix.rust }}
          bundles: ${{ matrix.bundles }}
          signing: test

      - name: Mount the .dmg and run the app from it (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg="$(ls packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          ls "$RUNNER_TEMP/dmg"
          echo "APP_PATH=$RUNNER_TEMP/dmg/Ogden Agents.app" >> "$GITHUB_ENV"

      - name: Install the app silently (Windows)
        if: runner.os == 'Windows'
        run: |
          installer="$(ls packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe | head -1)"
          exe="$(node packages/desktop/scripts/install-nsis.mjs "$(cygpath -w "$installer")" "$RUNNER_TEMP\\ogden-installed" | tail -1)"
          echo "APP_PATH=$exe" >> "$GITHUB_ENV"

      - name: Smoke test
        run: node packages/desktop/scripts/smoke.mjs --app "$APP_PATH"

      # The other half of a universal app: the Intel slice under Rosetta.
      - name: Smoke test, Intel slice (macOS)
        if: runner.os == 'macOS'
        env:
          OGDEN_DESKTOP_ARCH: x86_64
        run: node packages/desktop/scripts/smoke.mjs --app "$APP_PATH"

      # A second launch, quit, an attached npm server, a busy quit, a killed shell (story 13.5).
      - name: Lifecycle test
        run: node packages/desktop/scripts/lifecycle.mjs --target ${{ matrix.target }} --app "$APP_PATH"

      # The update test (story 13.10): the installed app N reads a local fake release that serves N+1,
      # built here with the same throwaway key. Run last: it replaces the installed app.
      - name: Copy the app for the update test (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/update-app"
          ditto "$APP_PATH" "$RUNNER_TEMP/update-app/Ogden Agents.app"
          echo "UPDATE_APP=$RUNNER_TEMP/update-app/Ogden Agents.app" >> "$GITHUB_ENV"

      - name: Use the installed app for the update test (Windows)
        if: runner.os == 'Windows'
        run: echo "UPDATE_APP=$APP_PATH" >> "$GITHUB_ENV"

      - name: Unmount the .dmg (macOS)
        if: runner.os == 'macOS' && always()
        run: hdiutil detach "$RUNNER_TEMP/dmg" || true

      - name: Upload the unsigned installer and its update artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ogden-desktop-${{ matrix.leg }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig

      - name: Build version N+1
        working-directory: packages/desktop
        run: |
          next="$(node -e 'const [c]=require("../../package.json").version.split("-"); const p=c.split(".").map(Number); p[2]+=1; console.log(p.join("."))')"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/build-config.json","utf8")); c.version=process.argv[1]; fs.writeFileSync(process.env.RUNNER_TEMP+"/build-config-next.json", JSON.stringify(c))' "$next"
          # The bundler keeps earlier outputs; N's files must not be picked as N+1.
          rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"
          bundles=nsis; if [ "$RUNNER_OS" = "macOS" ]; then bundles=app; fi
          npx --yes @tauri-apps/cli@2.12.1 build --target ${{ matrix.target }} --bundles "$bundles" --config "$RUNNER_TEMP/build-config-next.json"

      - name: Update test
        run: node packages/desktop/scripts/update-e2e.mjs --app "$UPDATE_APP" --bundle "packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" --version-next "$NEXT_VERSION" --target ${{ matrix.target }}
