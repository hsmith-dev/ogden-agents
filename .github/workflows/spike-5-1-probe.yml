# TEMPORARY (spike 5.1): probes bmad-loop as the build driver and the OS
# behaviour epic 5 rests on. Removed before review; kept in history only.
name: Spike 5.1 probe

on:
  push:
    branches: [spike/5.1-build-driver]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Probe before a multiplexer is installed
        run: python scripts/spike-5-1/probe.py pre

      - name: Install a multiplexer (Linux)
        if: runner.os == 'Linux'
        run: tmux -V || (sudo apt-get update -q && sudo apt-get install -y -q tmux && tmux -V)
      - name: Install a multiplexer (macOS)
        if: runner.os == 'macOS'
        run: |
          start=$(date +%s)
          brew install tmux
          echo "brew install tmux took $(( $(date +%s) - start ))s"
          tmux -V
      - name: Install a multiplexer (Windows, psmux)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $url = gh api repos/psmux/psmux/releases/latest --jq '.assets[] | select(.name | endswith("windows-x64.zip")) | .browser_download_url'
          if (-not $url) { throw 'no windows-x64 asset on the latest psmux release' }
          $zip = Join-Path $env:RUNNER_TEMP 'psmux.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'psmux'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter psmux.exe | Select-Object -First 1
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "psmux from $url in $($sw.Elapsed.TotalSeconds)s"
          & $exe.FullName -V

      - name: Probe with a multiplexer
        run: python scripts/spike-5-1/probe.py post

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-5-1-${{ matrix.os }}
          path: ${{ runner.temp }}/spike-results
