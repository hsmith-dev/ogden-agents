name: Watch probe

# TEMPORARY (story 4.8): facts about fs.watch on the CI runners for the ticket
# watcher. Prints facts only; removed before review.
on:
  push:
    branches: [story/4.8-ticket-watch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: fs.watch probe (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Probe fs.watch
        run: node scripts/watch-probe.mjs
