description = "Implements BmadCatalogPort.detect in the bmad-catalog adapter (a read-only check for _bmad/ and _bmad-output/ in the workspace's real path) behind entry 2's detection route, and shows on the project's chats page, when the repo has BMad and every piece is off, the one offer This project already uses BMad Method. Turn on its features? with Choose features (linking to entry 2's Workspace settings anchor, which entry 5 fills) and Not now, remembered per project by core; detection runs when the chats page opens, not inside the add-project use-case, so it does not touch entry 4's code."
verify = "Against fixture repos with and without _bmad/, the offer shows only for the first, Not now hides it for good after a reload, Choose features opens the settings anchor, and a file-tree hash of the repo is identical before and after detection, turning pieces on and turning them off."
covers = ["E10-R5"]
after = [2]
hitl = false
risk = "low"
references = ["_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-12--bmad-is-discovered-not-hard-coded"]

[[entry]]
id = 4
type = "story"
title = "An app-wide default for new projects, Simple to start"
description = "Adds the install-level default pieces for new projects, kept by core in <dataDir>/preferences.json the way onboarding.json is kept (readable only by the user, replaced in one step, empty meaning Simple when missing or unreadable), behind entry 2's default routes; a New projects section in Settings (owning any Settings sidebar change) to choose Simple or BMad Method with chosen pieces; the add-project use-case, used by the add-project dialog and Welcome's project step, which creates the workspace with the default; and in Welcome's project step, asked once for the first project only, Simple chats or BMad Method? (Simple chats preselected; BMad Method turns on Planning and Board for that project and is greyed as Coming soon while no piece is available), which sets that project's pieces and leaves the app-wide default unchanged (user decision 2026-10-01)."
verify = "With no preferences file a project added from the dialog, and one added from Welcome with Simple chats kept, both start with every piece off; Welcome asks the question for the first project only and never again, and with a test-registered piece available, picking BMad Method there starts that project with Planning and Board on while the app-wide default stays Simple; after choosing BMad Method with Planning in Settings, the next added project starts with Planning on and earlier projects are unchanged; an unreadable preferences file falls back to Simple and logs only its error code."
covers = ["E10-R4"]
after = [2]
hitl = false
risk = "low"
unknown = "How Welcome remembers it has asked (the onboarding.json flags are assumed), so a later first-run path never asks again."
references = [
  "packages/core/src/onboarding.ts",
  "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#information-architecture",
]

