[[entry]]
id = 9
type = "story"
title = "End-to-end suite and release"
description = "Extends the end-to-end suite, run in CI on macOS, Windows and Linux against the packed package, to add a project and chat in several chats with nothing BMad shown or written, turn a test-registered piece on and off in Workspace settings with a second tab following, refuse a guarded route while it is off, show and dismiss the offer for a repo with _bmad/ leaving its files unchanged, change the app-wide default, and upgrade a 0.2.0 data folder; then the user runs the simple-project flow live with Claude Code and tags a release after 0.2.0 through the epic 1 release workflow."
verify = "The suite passes on all three OSes and fails when the guard in requireBmadFeature is removed, and the tagged ogden-agents version from npm passes the epic's live Done when checks on the user's machine."
covers = ["E10-R1", "E10-R2", "E10-R3", "E10-R4", "E10-R5", "E10-R6", "E10-R7", "E10-R8"]
after = [8, "3.10"]
hitl = true
risk = "medium"
unknown = "Which version number this ships as (0.3.0 alone, or with epic 4); 0.2.0 is unchanged."
