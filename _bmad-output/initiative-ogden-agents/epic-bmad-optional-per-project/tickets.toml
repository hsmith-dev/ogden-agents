[[entry]]
id = 1
type = "story"
title = "Tracer bullet: one BMad piece switched on and off for a project"
description = "Adds one piece flag to the workspace row (a drizzle migration after 0003_caution_level, all off), carries it in WorkspaceSettings through GET and PATCH /api/v1/workspaces/:wsId/settings and a core use-case that emits workspace.settings_changed, a minimal requireBmadFeature guard in core that refuses with feature_off, one test-only route behind it, and a bare switch in Workspace settings; the hitl steps are the user approving CAP-19 and AD-22 into the spec and spine before the build starts (done: approved by the user 2026-10-01 and applied), and the developer flipping the switch live."
verify = "Live, flipping the switch in one tab shows the new state in a second open tab without a reload and survives a server restart; in CI, PATCH sets the flag and appends one workspace.settings_changed, and the test-only route returns feature_off while the flag is off and succeeds once it is on."
covers = ["E10-R1", "E10-R2", "E10-R6"]
after = ["2.8", "9.5", "3.9"]
hitl = true
risk = "medium"
unknown = "Whether workspace.settings_changed can grow a pieces payload while the stored 0.2.0 caution-level events still parse; the tracer records the approach and entry 2 freezes it."
notes = [
  "From the epic 9/3 retros (2026-10-01, user approved): the user merges the stack through epic 3 (#36, #37, #34, #38 to #47) to main; 10.1 was already built stacked on #49, so it and the rest of epic 10 rebase onto main once that merge lands instead of stacking further (epic 9 retro Q1, A4; epic 3 retro Q4). A base-branch change only: no change to 10.1's built code.",
]
references = [
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-11--only-core-writes-the-database-adopted",
  "packages/core/drizzle/0003_caution_level.sql",
]

[[entry]]
id = 2
type = "story"
title = "Epic contracts and stubs: the per-project BMad pieces"
description = "Freezes in shared the piece list (planning, board, builds, retrospectives) with each plain label and sentence and the dependency rule (builds needs board, retrospectives needs builds) as one function, the WorkspaceSettings pieces field, a workspace.settings_changed payload that old 0.2.0 events still parse, the feature_off error code, the install's available-pieces response, which always lists all four pieces, each with available and, when not, a coming-soon reason (user decision 2026-10-01), and how a later epic registers a piece as available, the app-wide default request and response, Welcome's one-time Simple chats or BMad Method answer for the first project, the detection response (hasBmad, hasOutput, offerDismissed) and the route and anchor of the Workspace settings BMad section that the offer links to; completes the core requireBmadFeature guard, the server helper that registers a piece's routes through it, and a read-only BmadCatalogPort.detect with a catalog-memory stub, and pre-registers the detection, offer-dismiss, available-pieces and default routes, so epic 4 can depend on this entry alone and entries 3 to 6 open at once. Every shared shape of the epic, including user-facing reasons and close codes, lives in shared (epic 3 retro A2)."
verify = "Contract tests parse every new shape, the error code and both the old and new workspace.settings_changed payloads; the dependency function's table test covers every combination; the memory stub drives detect; the route-registry test in gate.test.ts lists every new route behind the gate under /api/v1."
covers = ["E10-R1", "E10-R2", "E10-R4", "E10-R5", "E10-R7"]
after = [1]
hitl = false
risk = "medium"
unknown = "How a later epic's registration flips a piece from coming soon to available without a core change (a registry in the server wiring is assumed)."
notes = [
  "From the epic 9/3 retros (2026-10-01, user approved): a reviewed story: its review is recorded in the plan's Review Triage Log with lenses_ran filled (epic 3 retro L1).",
  "From the epic 9/3 retros (2026-10-01, user approved): owns the epic's fakes and fixtures (the fake BMad repo, any fake tickets.py or uv runner), which behave like the real program in process count, stdin mode and timing; a timeout test against a fake says what real cost it stands for (epic 3 retro A9, L3).",
]
references = [
  "packages/shared/src/chat.ts",
  "packages/shared/src/events.ts",
  "_bmad-output/initiative-ogden-agents/epic-planning-and-board/epic-planning-and-board.md",
]

[[entry]]
