[[entry]]
id = 6
type = "story"
title = "End-to-end suite and release"
description = "Extends the end-to-end suite, run in CI on macOS, Windows and Linux against the packed package with the fake runner, to follow a run in the run view and the Runs tab, apply a saved fix and retry, use Build all ready from the board, see a run whose tests fail show its failing check and test output in the run view, Runs tab and card, check it again after a fix, receive the blocked and ready-for-review webhooks, see both in Needs you, and find no Runs tab, Build action or notification for a workspace with builds off; then the user runs Flow 1 steps 8 to 11 live with Claude Code on macOS and tags the release after epic 5's through the epic 1 release workflow."
verify = "The suite passes on all three OSes and fails when the run view's verification detail is removed, and the tagged ogden-agents version from npm passes the epic's live Done when checks on the user's machines; each live check's result is written into the plan before the ticket moves to done."
covers = ["E11-R1", "E11-R2", "E11-R3", "E11-R4", "E11-R5", "E11-R6"]
after = [5, "5.11"]
hitl = true
risk = "medium"
plan_checkpoint = true
