[[entry]]
id = 9
type = "story"
title = "Per-agent failure words with Retry: rejected key, usage limit, auth expired"
description = "Adds the build failure reasons per kind in shared (`rejected_key`, `usage_limit`, `auth_expired`, `model_missing`, `sandbox_failed`) as blocked codes with plain words, and maps each build-capable agent's own failure words to them on a blocked run, reusing each quirk's existing `failureReason` hook, `acpReasons` and the descriptor's `usageLimitPatterns` (read in memory only): a rejected OpenAI key (Codex) or xAI token (Grok) names the key and sends the user to Settings, Agents; a usage limit names the agent and offers Retry and Build with another agent (which changes the run's agent and resumes from the plan's status in the same worktree, never automatically); an expired sign-in (Antigravity) offers sign in again then Retry; a missing model and a sandbox that failed to start have their own words; a rejected key or an expired sign-in never loops; the raw error text is never shown or logged. The reasons show in the run view's header, on the board card and in Needs you through the existing blocked path."
verify = "With each personality a run that fails with each word ends `blocked` with the agent's plain reason (no raw error text in the UI, events or logs), Retry resumes from the plan's status, Build with another agent changes the agent and keeps the worktree, a rejected key does not retry by itself, the words appear in the run view, the board card and Needs you, and no dashes appear in the new copy."
covers = ["CAP-9", "CAP-16", "CAP-15"]
after = [5, 6, 7, 8]
hitl = false
risk = "medium"

