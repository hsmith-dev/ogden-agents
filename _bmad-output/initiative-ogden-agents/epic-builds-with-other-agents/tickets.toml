[[entry]]
id = 7
type = "story"
title = "Antigravity builds: Ogden answers every card, no Skip all, and a sandbox or attended only"
description = "Adds Antigravity as a build agent only if the spike says go: its build quirk (Ask mode only, set at start and verified by what it reports, never Skip all, never `auto_edit` which approves protected files; every card answered by core's rule, none shown), its tool-path fields, its skill invocation and `bmad-build-auto` reaching it through its skills folder in the worktree, its halt wording, its Google sign-in or Gemini API key as chat keeps it (with the terms notice repeated where the user chooses it, the user's decision from the spike), and its sandbox if the spike found one; with none, Antigravity builds are attended only and the unattended path stays refused (`sandbox_unavailable`)."
verify = "With the Antigravity personality and the conformance suite an edit in a protected path is rejected even though a fake `auto_edit` would approve it, Skip all is never sent, a request in a mode that asks less is refused, with no sandbox an unattended build is refused and an attended build works with every request a card, and the three OSes pass; live checks: a real Antigravity attended build and, if a sandbox exists, an unattended one."
covers = ["CAP-15", "CAP-8", "CAP-16", "CAP-4"]
after = [4]
hitl = false
