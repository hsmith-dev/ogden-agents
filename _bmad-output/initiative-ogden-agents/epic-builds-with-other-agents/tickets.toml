[[entry]]
id = 8
type = "story"
title = "Build dialog agent picker per run and a default build agent per project"
description = "Adds the picker on the Build dialog and the setting it reads: the dialog opens from a card's Build when more than one agent can build here, or on a refusal, listing the agents that are set up with each unavailable one shown with its plain reason (not set up, no key, no sandbox on this computer, attended only) and the choice applying to that run only; \"Use another agent\" in the sandbox-unavailable dialog is enabled and lists the agents that can build; the project's default build agent in Workspace settings (a new nullable `defaultBuildAgentId` in shared with its use-case and route, falling back to the project's default chat agent if it can build, else Claude Code), a note under Antigravity's choice with the terms notice if the user's decision from the spike asks for it, and Build all ready using the project's default; with one choice Build behaves as it does now. New copy is plain language with no dashes."
verify = "Component and e2e tests with the fake personalities: Build on a card with two build-capable agents opens the picker, an unavailable agent shows its reason and cannot be chosen, the choice starts the run with that agent and is not remembered, the default build agent is saved per project and used by Build all ready, with a single build-capable agent Build starts at once, and the keyboard and screen reader paths and the dialog's focus work."
covers = ["CAP-15", "CAP-8", "CAP-19"]
