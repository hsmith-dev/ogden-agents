description = "Adds tauri-plugin-updater to the shell, and a local fake release server fixture (`tests/fixtures/fake-release-server`) that serves `latest.json` and artifacts signed with 8's test key, which 13 reuses; It uses the committed public key and one endpoint per channel (stable by default, next when the user picks it in 3's Settings row, read through 3's launcher call, matching npm's dist-tags); checks only on start (no periodic checks, user 2026-10-04), plus when the user picks the menu's Check for updates; downloads in the background, verifies the minisign signature and the SHA-256 from `SHA256SUMS`, and reports the ready update through 3's launcher call, so the web UI shows \"Update available — Restart to update\" with the notes; Restart never happens while 3's busy rule says an agent turn or a build is running (user, 2026-10-04): the button is disabled with the reason and offers \"Restart when they finish\"; builds join the rule when epic 5's runs register in it, and that part is tested when runs exist; on restart it quits the server cleanly (5's quit), installs (Windows `passive`), and relaunches; a failed download, signature or install keeps the running version and says why; downgrades are refused; a `.deb` install shows a notice with the release link instead of installing."
