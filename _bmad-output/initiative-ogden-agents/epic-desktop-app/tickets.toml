# Epic 13 breakdown. Table order is the build order; ids never change once written.
# Drafted autonomously 2026-10-04 and approved by the user the same day (decisions in the epic's Notes, Approval).
# 1 is a spike that ends in the user's go or no-go; nothing after it starts on a no-go.
# 2 is the tracer bullet; 3 owns every shared contract and file, so the lanes after it open at once.
# Lanes after 3: runtime (4), shell lifecycle (5), data folder (6), npm notice (7). 8 joins 4 and 5; 9 follows 8; 10 joins 5 to 9; 11 follows 5 and 7.
# References to other epics use "<epic id>.<entry id>".
# No agent ever generates, sees or stores the user's updater signing key or code-signing secrets; 9's hitl step is the user's.

[[entry]]
id = 1
type = "spike"
title = "Can a Tauri app run Ogden's packed server on a bundled Node on all three OSes?"
description = "Adds a temporary CI job on macOS (arm64 and x64), Windows (x64 and ARM64) and Linux (Ubuntu 22.04 x64 and arm64) that builds a minimal Tauri 2.12 shell with the official Node 24 LTS binary as its `externalBin` sidecar (pinned and SHA-256-checked) and the packed `ogden-agents` tarball's server with production node_modules as resources, starts the server, gets a launch URL from `/launcher/hello?launch=1`, opens a window on it, and records: bundle and installed size per format, cold start to first page, whether better-sqlite3, @napi-rs/keyring and node-pty load from the resources, whether the bundled npm is found by `findNpmCli` so installing Claude Code from Welcome (9.3) works on a machine with no Node, whether killing the sidecar leaves its children on each OS (and whether a Windows job object fixes it), WebView2 presence on the Windows runners and webkit2gtk-4.1 on Linux, the gate's checks from inside the webview, whether MSI builds on ARM64, an updater dry run from N to N+1 with a throwaway key generated inside the job (never the user's), whether an unsigned macOS app relaunches after the updater replaces it, and a re-check of Node SEA as an alternative; the hitl step is the user reading the results and deciding go or no-go."
verify = "The job's logs on every OS and architecture answer each question, the findings, measured numbers and a go or no-go recommendation are written into the plan, the user's go or no-go is recorded as a dated Decision in the epic's Notes, and the temporary job is removed."
covers = ["E13-R1", "E13-R2", "E13-R3", "E13-R4", "E13-R6"]
after = []
hitl = true
risk = "high"
unknown = "Whether native modules built for Node 24 load from the app's resources on every target, whether the sidecar's children survive a kill on Windows, and whether the updater works on an unsigned, ad-hoc-signed macOS app."
references = ["https://v2.tauri.app/develop/sidecar/", "https://v2.tauri.app/plugin/updater/", "https://nodejs.org/api/single-executable-applications.html", "packages/server/src/launcher.ts"]

[[entry]]
id = 2
type = "story"
title = "Tracer bullet: the app opens Ogden's window on its bundled server"
description = "Starts only on the user's go from 13.1. Adds `packages/desktop/` (the `src-tauri` crate on Tauri 2.12 with a pinned Rust toolchain, identifier `dev.ogden-agents.app`, and a build script that stages the pinned Node sidecar and the packed server as resources) and a CI job that builds a dev app on all three OSes; the shell starts the sidecar running `serve.js` against the normal data folder, waits for `server.json`, reads the launcher token, gets a launch URL from `/launcher/hello?launch=1`, and opens one window on `http://127.0.0.1:<port>/#c=<code>` with no Tauri IPC granted to that origin; closing the window quits the server with `/api/server/quit`, as the AD-3 note allows (applied 2026-10-04). The hitl step is the user opening the macOS build on their own Mac and seeing Welcome or their projects."
verify = "CI builds the dev app on macOS, Windows and Linux and a headless smoke starts it, reaches `server.started` and the page's tab exchange, and leaves no Ogden or Node process after quit; the user sees their Ogden window on their Mac and records it in the plan."
covers = ["E13-R1", "E13-R2", "E13-R3"]
after = [1, "4.13"]
hitl = true
risk = "high"
unknown = "Whether Tauri's window can open an External URL with a fragment and keep `sessionStorage` across the boot script's redirect on all three webviews."
references = ["packages/server/src/launcher.ts", "packages/server/src/serve.ts", "packages/server/src/gate.ts", "packages/server/src/auth.ts", "packages/server/src/launcher-token.ts"]

[[entry]]
id = 3
type = "story"
title = "Epic contracts and stubs: shell launcher calls, update prompt, runtime pins and app config"
description = "Adds what the lanes after it share, each with a stub, in new modules (`packages/server/src/shell-mode.ts` and an `update-notice/` folder wired into `start.ts` once here, so 6 and 7 never edit `start.ts`): a `desktop-node-pins.json` with the Node version and SHA-256 per OS and architecture, checked by a `scripts/desktop-pins.mjs --check` in CI; the server's shell mode (`OGDEN_AGENTS_SHELL=desktop`, set only by the app), which the launch page and Welcome can read through an existing config route; a parent-watch hook the server runs in shell mode (exit when stdin closes); a launcher `--json --no-open` mode that does the existing find, attach, AD-20 handshake and start and prints `{port, launchUrl}`, so the shell runs it through the bundled Node and never re-implements the handshake in Rust (5 uses it); `/launcher/*` calls behind the launcher token for the shell to report an available update (`version`, `notes`, `channel`, `downloaded`) and to poll whether the user asked to restart, and to read the chosen update channel; the settings route, schema and stored values for the npm check switch (7) and the update channel (10), with their Settings rows as stubs; the `app.update_available` and `app.update_requested` events with their schemas; one update notice service in the server with two sources (desktop and npm) and one web `UpdateBanner` component with stub sources; the busy rule the restart uses, as one function: no busy session per AD-20 today, which epic 5 extends with running runs (handoff to epic 5); the restart never happens while it says busy (user, 2026-10-04); and the Tauri config skeleton every lane edits only in its own section: capabilities with nothing on the server's origin, a navigation guard, a CSP-preserving window, and named, empty bundle, updater and signing sections; the desktop CI workflow from 2 split into one named job per lane (runtime, shell, upgrade, packaging); and EXPERIENCE.md and DESIGN.md entries for the app launch, the app menu, quit with busy sessions and the update prompt (app and npm), which 5, 7 and 10 build from."
verify = "Contract tests pass: pins check passes and fails on a changed hash, the launcher calls refuse without the launcher token, the events validate, the banner renders each stub source, the server in shell mode exits when its stdin closes, and the Tauri capability test finds no permission on the server's origin."
covers = ["E13-R2", "E13-R3", "E13-R4", "E13-R6", "E13-R7"]
after = [2]
hitl = false
risk = "medium"
unknown = "Whether an existing config route can carry shell mode, or a small new one is needed."
references = ["packages/server/src/launcher.ts", "packages/server/src/start.ts", "packages/shared/src", "packages/web/src"]

[[entry]]
id = 4
type = "story"
title = "Bundled runtime: pinned Node and the packed server for every target"
description = "Completes the build script from 2 for every target in E13-R1: downloads the pinned Node from nodejs.org for the target, checks it against `desktop-node-pins.json` (3) and refuses a mismatch, renames it to Tauri's `node-<target triple>` sidecar name, stages the npm that ships with that Node beside it in the layout `findNpmCli` resolves (`node_modules/npm/bin/npm-cli.js` next to the binary, or a resource-path option it gains), so agent installs (9.3, and epic 12's) work with no Node on the machine, installs the packed `ogden-agents` tarball's production dependencies for that target (better-sqlite3, @napi-rs/keyring and node-pty prebuilt for the target; node-pty is required in the app because hidden-PTY sign-in (9.1) and the terminal toggle need it, while AD-19 still lets the server run without it), prunes what the server never loads, and records the staged size; on Windows ARM64 and Linux arm64 it runs on native runners because those prebuilds do not cross-build."
verify = "CI stages the runtime for all six targets, a staged server starts on each native runner with only the staged Node on PATH, a tampered Node download fails the build, a staged app installs Claude Code from fixtures through its bundled npm, and the build fails if node-pty is missing for any target."
covers = ["E13-R2"]
after = [3]
hitl = false
risk = "medium"
unknown = "Whether better-sqlite3, @napi-rs/keyring and node-pty have prebuilds for Windows ARM64 and Linux arm64 on Node 24, or must build from source on those runners."
references = ["package.json", "packages/server/package.json", ".github/workflows/ci.yml", "packages/adapters/src/setup-claude-code/install.ts"]

[[entry]]
id = 5
type = "story"
title = "Single instance, app menu, window and clean quit"
description = "Completes the shell's lifecycle: the single-instance plugin registered first, so a second launch focuses the window; an app menu with About (version), Check for updates (a stub until 10) and Quit; closing the window keeps the app in the Dock on macOS and quits on Windows and Linux; quit asks the server's quit route, shows the server's busy-session confirmation in the window, then stops the sidecar and, if anything remains after a timeout, runs `killProcessTree` on it; on Windows the sidecar runs in a job object with kill-on-close, so a crashed shell leaves nothing; at start the shell runs 3's launcher `--json --no-open` mode on the bundled Node, so a server from `npx ogden-agents` that already holds the data folder's instance lock is attached to under AD-20 (restart when idle if older, never stopping busy sessions), and quitting the app leaves a server it only attached to running, stopping only a server the app started (user, 2026-10-04); navigation off the server's origin is refused and external links open in the system browser."
verify = "Against the built app on three OSes: a second launch focuses the first window and starts no second server; quit with an idle server leaves no Ogden, Node or agent process; quit with a busy fake session asks first; killing the shell process on Windows leaves no child; an npm-started server is attached to, not restarted while busy, and still running after the app quits; a link to an outside site opens in the system browser and the window stays on Ogden."
covers = ["E13-R1", "E13-R3", "E13-R4"]
after = [3]
hitl = false
risk = "high"
unknown = "How the busy confirmation is best shown when the user quits from the menu or Dock (the web UI's own dialog through an event, or a native dialog)."
references = ["https://v2.tauri.app/plugin/single-instance/", "packages/adapters/src/process-tree.ts", "packages/server/src/instance-lock.ts", "packages/server/src/port-file.ts"]

[[entry]]
id = 6
type = "story"
title = "Data folder on upgrade: backup, migrations and refusing a newer database"
description = "Keeps the data folder where `dataDirPath()` puts it and makes upgrades safe for both routes: before drizzle's migrations run on a version change, the database is copied to `<dataDir>/backups/ogden-agents-<old version>.db` (keeping the last three); a database migrated by a newer version than the running one is refused with a plain message and the server does not start, instead of failing on unknown tables; the existing upgrade tests (`upgrade-0.2.0.spec.ts`, `upgrade-journey.spec.ts`) are extended to npm N to app N+1, app N to app N+1 and npm and app sharing one folder."
verify = "The extended upgrade tests pass on three OSes: a 0.2.0 fixture folder upgrades with a backup written and chats intact, and an older server started on a newer database exits with the plain message and changes nothing."
covers = ["E13-R5"]
after = [3]
hitl = false
risk = "medium"
unknown = "Whether drizzle's journal gives a clean way to detect a newer database, or the server must record its own schema version."
references = ["packages/core/src/db/database.ts", "packages/core/src/data-dir.ts", "tests/e2e/upgrade-0.2.0.spec.ts", "tests/e2e-installed/upgrade-journey.spec.ts", "tests/fixtures/data-folder-0.2.0.ts"]

[[entry]]
id = 7
type = "story"
title = "npm users see that a newer version is available"
description = "Fills the npm source of 3's update notice service: when not in shell mode, the server reads `https://registry.npmjs.org/ogden-agents` dist-tags on start only (on by default, user 2026-10-04), compares the tag that matches its own version (`latest` for a stable version, `next` for a prerelease), and shows 3's banner with the command that updates (`npx ogden-agents@latest`, or the start-scripts story's command once it lands); offline or on any error it stays silent; Settings gains a switch that turns the check off, with a sentence saying it fetches only the package's public version list."
verify = "Against a fake registry: a newer version on the matching tag shows the banner once per version, an equal or older one shows nothing, a prerelease compares against `next`, the switch stops the request entirely, an unreachable registry logs nothing to the user, and in shell mode the npm source never runs."
covers = ["E13-R7"]
after = [3]
hitl = false
risk = "low"
unknown = "Whether the registry read needs a timeout shorter than server start, so a slow network never delays the page."
references = ["packages/server/src/start.ts", "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md"]

