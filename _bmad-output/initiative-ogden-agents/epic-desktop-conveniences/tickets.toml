[[entry]]
id = 9
type = "story"
title = "End-to-end suite and v1.3 release part; installer checks on each OS"
description = "Adds the epic's end-to-end journey with fakes only, updates docs, and lists the user's installer checks on macOS, Windows and Linux: tray, shortcut, attachments and a worktree chat in the installed app; and on the npm route checks that attachments and worktree chats work while the tray and shortcut are absent."
verify = "The end-to-end suite passes in CI on all three OSes, and the user's installer check results are recorded in the plan."
