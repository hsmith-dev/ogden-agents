references = ["_bmad-output/initiative-ogden-agents/deferred-work.md"]

[[entry]]
id = 14
type = "story"
title = "End-to-end suite and release"
description = "Extends the installed end-to-end suite, in CI on macOS, Windows and Linux against the packed package, to: install and sign into each fake agent; run three agents' chats at once in one Simple project; restart and resume; toggle the terminal where offered; plan with Codex where Planning is on; and build with each agent where builds are on. Writes the final agent-matrix.md rows for Codex and Gemini CLI from the spike and the live checks, through bmad-spec, leaving no verify cell for a v1 agent. Then the user runs each supported agent's live checks on macOS and Windows on npx ogden-agents@next, records each result in the plan, and tags this epic's release after epic 5's through the release workflow."
verify = "The suite passes on all three OSes, and the tagged version from npm passes each agent's live Done when checks on the user's machines, each recorded under Live check result before the ticket moves to done."
covers = ["E6-R1", "E6-R2", "E6-R3", "E6-R4", "E6-R5", "E6-R6", "E6-R7", "E6-R8", "E6-R9"]
after = [13, "epic-unattended-builds"]
hitl = true
risk = "medium"
unknown = "The version number, set by the user here after epic 5's release."
