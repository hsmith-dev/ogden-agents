# Epic 6 breakdown: DRAFT by autonomous inception, 2026-10-02, not approved. Table order is the build order; ids are proposed and fixed once approved.
# References to other epics use "<epic id>.<entry id>". Epic 5 has no tickets.toml on this base (its inception is on docs/epic-5-inception), so 11 and 14 name "epic-unattended-builds" until it merges; then pin 11 to "5.6", "5.7" and "5.9" (its live check needs dispatch and review) and 14 to "5.11", or to epic 11's release if epic 11 builds before this epic.
# Live checks use the developer's own Codex and Gemini CLI logins or API keys, in a scratch repo, never Ogden Agents's own repo.

[[entry]]
id = 1
type = "spike"
title = "Probe Codex and Gemini CLI over ACP on three OSes"
description = "Adds a temporary CI job, Windows first, then macOS and Linux, that installs the pinned codex-acp and gemini-cli into a temp data folder with npm ci, spawns each over ACP from a script on @agentclientprotocol/sdk, and records the advertised auth methods and which work headless, new, load and resume, the permission option ids and kinds each sends for a shell command, whether `codex resume <id>` and `gemini --resume <uuid>` reopen the ACP session, binary resolution (including .cmd shims on Windows), the stop-the-tree behaviour, and whether each agent's native sandbox runs on that OS; the hitl step is the user reading the results and answering which agents are in v1."
verify = "The probe job's logs on all three OSes answer each question for both agents, the results are written into the plan and proposed as agent-matrix.md rows, and the temporary job is removed or left disabled."
covers = ["E6-R9", "E6-R4", "E6-R5", "E6-R6"]
after = []
hitl = true
risk = "high"
unknown = "Whether either agent's sign-in can finish headless without a TTY on Windows, and whether Gemini's ACP session id resumes in its CLI."

[[entry]]
id = 2
type = "story"
title = "Tracer bullet: a Codex chat beside a Claude Code chat in one project"
description = "Adds agentId to Session (a drizzle migration where existing rows read claude-code) and to the create-session request, a minimal agent registry by AgentId in the server wiring that core looks up through, a bare acp-codex adapter copied from acp-claude-code's chat path, and a bare agent picker in the composer for new chats, so one project holds a Claude Code chat and a Codex chat working at once; the hitl step is a live check with a real Codex login."
verify = "In CI against two fake ACP agents, two sessions in one workspace each reach their own agent and both stream at once; live, a Codex chat and a Claude Code chat in one scratch project both answer, and the sidebar lists both."
covers = ["E6-R1", "E6-R2", "E6-R4"]
after = [1, "2.7", "9.1"]
hitl = true
risk = "high"
unknown = "Whether a session's agent can be looked up per call in core's chat use-cases without changing AgentPort's methods (assumed: a lookup port passed to the chat use-cases)."

[[entry]]
id = 3
type = "story"
title = "Epic contracts and stubs: agents as a choice"
description = "Freezes in shared: the agent descriptor list response (id, product name, provider name, chat, terminal resume, builds, sign-in methods, key variable, install state); the workspace default agent field in WorkspaceSettings and its settings_changed payload, which old events still parse; error codes and plain reasons (agent_not_installed, agent_signed_out, agent_unknown); key redaction patterns per provider, AGENT_ENV_KEYS derived from each registered agent's key variable, and .codex, .gemini, .agents and gemini.md in core's PROTECTED_NAMES. Makes core refuse a new chat for an agent that is not installed or not signed in with agent_not_installed or agent_signed_out and the action to fix it, and makes the terminal availability check (createTerminalAvailability, wired once in start.ts) look up the session's agent through the registry. Pre-registers the codex and gemini-cli wiring slots in the server's agent registry with their memory stubs, so entries 5 to 8 fill them and never edit start.ts or core's protected names. Adds the architecture test that core and shared name no agent id. Generalizes the fake ACP agent to play Codex and Gemini (their auth method ids, option ids, load-only resume) through FAKE_ACP_* variables. Adds memory stubs for each new adapter, and pins/ folders for codex and gemini with the spike's versions, checked by scripts/agent-pins.mjs. Every later entry builds on these shapes alone."
verify = "Contract tests parse every new shape and the old settings_changed payload; the architecture test fails on a planted agent id in core and in shared; a new chat for a missing or signed-out fake agent is refused with its code; terminal availability answers per session's agent; the fake agent drives each personality in a test; agent-pins --check passes on three OSes."
covers = ["E6-R1", "E6-R2", "E6-R5", "E6-R9"]
after = [2, "3.7"]
hitl = false
risk = "medium"
references = ["packages/shared/src/entities.ts", "packages/shared/src/setup.ts", "packages/server/src/terminal-availability.ts", "tests/fixtures/fake-acp-agent.mjs", "scripts/agent-pins.mjs", "tests/architecture.test.ts"]

[[entry]]
id = 4
type = "story"
title = "Extract the shared ACP client from acp-claude-code"
description = "Moves the agent-neutral parts of acp-claude-code/claude-code-agent.ts (ACP wiring, the session/update and AD-4 state mapping, the resume, load, then new reopen order, permission requests by option kind, auth_required, mask.ts and timeouts) into packages/adapters/src/acp-base, stopping processes through the existing packages/adapters/src/process-tree.ts. acp-claude-code keeps only its spawn, auth methods, path fields, terminal resume and transcript reader, and the tracer's acp-codex moves onto the base. Claude Code's behaviour does not change. The base gains the one rule both new agents need: a permission request that offers neither an allow_once nor a reject_once option is cancelled and logged, never answered with another option."
verify = "Every existing Claude Code chat, resume, permission and terminal test passes unchanged, acp-claude-code and acp-codex share no copied code, and a fake request offering only allow_always is cancelled and logged."
covers = ["E6-R3"]
after = [3]
hitl = false
risk = "medium"
references = ["packages/adapters/src/acp-claude-code/claude-code-agent.ts"]

[[entry]]
id = 5
type = "story"
title = "Codex chat: permissions, resume and the terminal toggle"
description = "Completes acp-codex on the shared base. Codex's tool input fields map to card paths. Allow once and Deny pick the options of kind allow_once and reject_once, never allow_for_session or a policy amendment. Reopen uses session/resume. terminalResume runs `codex resume <id>` from the pinned binary, with its transcript reader for import after switching back, if the spike confirmed the id."
verify = "Against the fake agent's Codex personality, a shell command waits for its card, Always allow is enforced by core with no allow option sent to the agent, a chat continues after a server restart, and the terminal toggle is offered for Codex and switches there and back."
covers = ["E6-R4", "E6-R6", "E6-R1"]
after = [4, "3.8"]
hitl = false
risk = "medium"
unknown = "Whether Codex writes a transcript Ogden can import after a terminal turn, as Claude Code's JSONL is."

[[entry]]
id = 6
type = "story"
title = "Codex install, sign-in and API key from the UI"
description = "Adds setup-codex behind AgentSetupPort. Install puts the pinned codex-acp into the data folder as 9.3 does. Sign-in uses the ChatGPT browser or device-code login by the route the spike chose, with the URL or code shown in the agent card. The API key goes through the keychain as agent-api-key/codex and is passed only as CODEX_API_KEY in Codex's child environment. Saving the key checks it with OpenAI first, and the setup status names OpenAI as the provider, which entry 9's generic agent card shows. This entry owns the sign-in-through-ACP-authenticate path in the setup adapter pattern, which entry 8 reuses for Gemini."
verify = "Against fake install and login fixtures on three OSes, Settings: Agents installs Codex and signs in with each method, a saved key reaches only Codex's child environment, and a scan of the database, the event log and the logs finds no key; live, a real ChatGPT login and a real key each chat."
covers = ["E6-R5"]
after = [9]
hitl = false
risk = "high"
unknown = "Whether codex-acp's chat-gpt method opens the browser itself or hands the URL to the client."
references = ["packages/adapters/src/setup-claude-code/install.ts", "packages/adapters/src/setup-claude-code/api-key.ts"]

[[entry]]
id = 7
type = "story"
title = "Gemini CLI chat: permissions, resume and context"
description = "Adds acp-gemini on the shared base, spawning the pinned `gemini --acp`. Gemini's tool input fields map to card paths. Allow once and Deny pick allow_once and reject_once, never ProceedAlways. Reopen uses session/load, else the stored-transcript fallback. AGENTS.md is set as a context file without writing into the repo. terminalResume runs `gemini --resume <uuid>` only if the spike confirmed it; otherwise the toggle reports agent_unsupported."
verify = "Against the fake agent's Gemini personality, a shell command waits for its card, a chat continues after a restart through session/load, the terminal toggle matches the spike's result, the spawn carries the AGENTS.md context setting, and a repo file-tree hash is unchanged by a Gemini chat in a Simple project."
covers = ["E6-R4", "E6-R6", "E6-R7"]
after = [4]
hitl = false
risk = "medium"
unknown = "Whether Gemini CLI takes its context file name from an environment variable or flag, so Ogden writes no .gemini/settings.json."

[[entry]]
id = 8
type = "story"
title = "Gemini CLI install, sign-in and API key from the UI"
description = "Adds setup-gemini behind AgentSetupPort. Install puts the pinned @google/gemini-cli into the data folder. Sign-in uses Google login (oauth-personal) by the route the spike chose, reusing entry 6's ACP-authenticate sign-in path. The API key goes through the keychain as agent-api-key/gemini-cli and is passed only as GEMINI_API_KEY. Saving the key checks it with Google first, and the setup status names Google as the provider. Vertex AI is not offered."
verify = "Against fake install and login fixtures on three OSes, Settings: Agents installs Gemini CLI and signs in with each method, a saved key reaches only Gemini's child environment, and a scan of the database, the event log and the logs finds no key; live, a real Google login and a real key each chat."
covers = ["E6-R5"]
after = [6]
hitl = false
risk = "high"
unknown = "Whether Gemini's oauth-personal finishes headless through ACP authenticate on Windows."

[[entry]]
id = 9
type = "story"
title = "Pick the agent per chat and per project"
description = "Builds the designed agent picker in the composer footer for new chats (installed and signed-in agents enabled, others with their reason and a link to Settings: Agents), the default agent in Workspace settings through PATCH settings and workspace.settings_changed, the agent named on every sidebar row, the session header and Needs you, Welcome offering every agent with the chosen one becoming the default, replaces the web's AGENT_ID and AGENT_NAME constants (chat-api.ts, sign-in-again.tsx, status-sidebar.tsx and the other users) with the agent list from 3's response, and makes the agent card and Sign in again generic: the card names the provider from the setup status and shows a sign-in URL or device code when the setup adapter gives one, which entries 6 and 8 supply (closes the 9.2 Anthropic-wording deferral)."
verify = "Playwright against two fake agents: a new chat preselects the project's default, changing the default in one tab shows in another without a reload, a signed-out agent is shown disabled with its reason, every sidebar row names its agent, and grep finds no AGENT_NAME constant left in packages/web."
covers = ["E6-R1"]
after = [3]
hitl = false
risk = "medium"
references = ["packages/web/src/chat/chat-api.ts", "packages/web/src/onboarding/welcome-model.ts", "packages/web/src/agents/agent-card.tsx", "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#component-patterns"]

[[entry]]
id = 10
type = "story"
title = "BMad skills for every agent where Planning is on, nothing where it is off"
description = "Extends 4.3's setup to place the bundled skills in each in-use agent's skill folder (.agents/skills for Codex and Gemini CLI, alongside .claude/skills), only for projects with Planning on. Each agent adapter formats the planning skill invocation 4.6 asks for (Codex's $skill syntax, Gemini's prompt form). 10.6's simple-project test is extended so that no agent's session start carries BMad skill or text with every piece off. Entries 11 and 12 rely on these skill folders for builds."
verify = "In a fixture repo with Planning on, a planning session with the fake Codex and fake Gemini agents receives its adapter's invocation and the skills exist in .agents/skills; with every piece off, each fake agent receives no BMad text and the repo's file-tree hash is unchanged."
covers = ["E6-R7"]
after = [5, 7, "4.3", "4.6", "10.6"]
hitl = false
risk = "medium"
unknown = "Whether the bundled setup.py's --root option is enough to place skills in .agents/skills, or a fork patch is needed."

[[entry]]
id = 11
type = "story"
title = "Codex builds through the build runner"
description = "Lets the Build dialog choose the agent (the project's default preselected) into 5.3's run agent field. 5.7's runner then runs bmad-loop's codex profile with the pinned Codex binary and the key in the child environment only. Codex's native sandbox (Seatbelt, bubblewrap, Windows) is added to 5.6's chain for the codex agent. The server answers the profile's first-run workspace and hook trust prompts. The bypass flag never runs outside a sandbox SandboxPort started. The dialog's use another agent choice lists agents that can build unattended here. An attended Codex build is an ACP build session on 5's acp-codex with permission cards, never the bypass profile. The run needs the .agents/skills folder entry 10 places."
verify = "In CI on three OSes with the fake bmad-loop and a fake Codex, a Codex run starts only inside a sandbox, a run with no sandbox is refused with the choices, and the run records codex; live on macOS and Windows, a real Codex completes bmad-build-auto on a scratch ticket through the UI."
covers = ["E6-R8"]
after = [5, 6, 10, "epic-unattended-builds"]
hitl = true
risk = "high"
unknown = "Whether epic 5's runner is bmad-loop or its ACP fallback (5.1), and whether Codex's Windows sandbox needs elevation the server cannot get without a prompt."

[[entry]]
id = 12
type = "story"
title = "Gemini CLI builds through the build runner"
description = "Adds the gemini-cli agent to 11's agent choice. The runner runs bmad-loop's gemini profile with the pinned binary and GEMINI_CLI_TRUST_WORKSPACE set. Gemini's sandbox (Seatbelt profile on macOS, the Windows sandbox, Docker or Podman where present) is added to the chain. The yolo approval mode never runs outside a sandbox SandboxPort started."
verify = "In CI on three OSes with fakes, a Gemini run starts only inside a sandbox and records gemini-cli; live on macOS, a real Gemini CLI completes bmad-build-auto on a scratch ticket through the UI."
covers = ["E6-R8"]
after = [7, 8, 11]
hitl = true
risk = "high"
unknown = "Whether Gemini's Windows sandbox leaves integrity-level changes on worktree files that block their removal."

[[entry]]
id = 13
type = "story"
