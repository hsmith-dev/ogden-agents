# Epic 6 breakdown (approved by the user 2026-10-02, reshaped from the autonomous draft to "Antigravity if possible"). Table order is the build order; ids never change once approved.
# Entry 1 ends with the user's go or no-go. On no-go, only the Antigravity entries (5, 7, 8) are dropped; the agent-choice groundwork (2, 3, 4, 6, 9, 10) is built without Antigravity, because v1.1 (Codex and Grok) builds on it (user, 2026-10-02). The decision is recorded in the epic's Notes and the initiative.
# References to other epics use "<epic id>.<entry id>". The standalone permission modes story (branch story/permission-modes) is not in this tree yet; entry 3 names it in `unknown` and adds it to `after` once it is placed.
# Live checks use the developer's own Google account or Gemini API key, in a scratch repo, never Ogden Agents's own repo.

[[entry]]
id = 1
type = "spike"
title = "Can Ogden drive Antigravity over ACP? Probe it and decide go or no-go"
description = "Adds a temporary CI job, Windows first, then macOS and Linux, that downloads the registry's pinned antigravity-acp archive for the OS into a temp data folder, checks its SHA-256, spawns agy_acp_server over ACP from a script on @agentclientprotocol/sdk, and records: the binary's version and how to read it from an existing copy, initialize's capabilities and auth methods, which sign-in works without a terminal (oauth-personal's URL or browser, gemini-api-key and how the key is given), new, load, resume and list, the session modes it offers and what each means, the permission option ids and kinds it sends for a shell command, its skill folder, whether the agy CLI can resume an ACP session id, stopping the process tree, and Windows behaviour; it also re-checks Google's terms text on third-party clients and Antigravity OAuth and reports any change since 2026-10-02; go requires Google sign-in and the API key to work without a terminal, and sessions, resume and permission cards to work, on all three OSes (any OS failing is a no-go, user 2026-10-02); the hitl step is the user reading the results and the terms report and deciding go or no-go."
verify = "The probe's logs on all three OSes answer each question, the results are written into the plan and proposed as agent-matrix.md rows, the terms re-check is recorded with any change flagged, the three-OS criterion is answered per OS, the user's go or no-go is recorded as a dated Decision in the epic's Notes, and the temporary job is removed or left disabled."
covers = ["E6-R8", "E6-R4", "E6-R5", "E6-R6"]
after = []
hitl = true
risk = "high"
unknown = "Whether Google's terms text has changed since 2026-10-02 (the user accepted the current terms' risk), whether sign-in finishes without a terminal on Windows and Linux, and how an API key reaches the server without Ogden writing its settings file."
references = ["_bmad-output/initiative-ogden-agents/spec-ogden-agents/agent-matrix.md", "https://github.com/agentclientprotocol/registry/blob/main/antigravity-acp/agent.json", "https://antigravity.google/terms", "https://github.com/zed-industries/zed/issues/63464", "https://github.com/zed-industries/zed/issues/64114"]

[[entry]]
id = 2
type = "story"
title = "Tracer bullet: two agents side by side in one project"
description = "Adds agentId to Session (a drizzle migration where existing rows read claude-code) and to the create-session request, a minimal agent registry by AgentId in the server wiring that core looks up through, and a bare agent picker in the composer for new chats, so one project holds a Claude Code chat and a chat with a second agent working at once. On a go, the second agent is a bare acp-antigravity adapter copied from acp-claude-code's chat path (the binary from the spike's download, found through a development-only environment variable, and the developer signs in out of band into Antigravity's own folder, because install and sign-in from the UI are entries 6 and 7). On a no-go, the second agent is the fake ACP agent registered as a test-only agent, and no Antigravity code is added. The hitl step is the live check: on a go, a real Antigravity sign-in beside Claude Code; on a no-go, Claude Code chats in a scratch project behave as before with agentId stored."
verify = "In CI against two fake ACP agents, two sessions in one workspace each reach their own agent and both stream at once; live, on a go an Antigravity chat and a Claude Code chat in one scratch project both answer and the sidebar lists both, and on a no-go a Claude Code chat answers and reopens unchanged with agentId claude-code."
covers = ["E6-R1", "E6-R2", "E6-R4"]
after = [1, "2.7", "9.1"]
hitl = true
risk = "high"
unknown = "Whether a session's agent can be looked up per call in core's chat use-cases without changing AgentPort's methods (assumed: a lookup port passed to the chat use-cases), and whether the standalone permission modes story, which also touches the composer and the Session shape, has merged first; if it is in the tree, this entry waits on it."

[[entry]]
id = 3
type = "story"
title = "Epic contracts and stubs: agents as a choice"
description = "Freezes in shared the agent-neutral agent list response (id, product name, provider, sign-in methods, key format, install state, terminal resume, and the permission modes each agent declares, from the permission modes story's AgentPort.permissionModes); the workspace default agent field in WorkspaceSettings and its settings_changed payload, which old events still parse; error codes and plain reasons (agent_not_installed, agent_signed_out, agent_unknown); AGENT_ENV_KEYS derived from each registered agent, and, on a go, Antigravity's key redaction pattern and .gemini and .agents in core's PROTECTED_NAMES. Makes core refuse a new chat for an agent that is not installed or not signed in with its code and the action to fix it, and makes terminal availability (createTerminalAvailability, wired once in start.ts) look up the session's agent through the registry. On a go, pre-registers the antigravity wiring slot in the server registry with memory stubs for acp-antigravity and setup-antigravity, so entries 5 and 7 fill them and never edit start.ts; on a no-go the registry holds Claude Code alone, plus test-only fake agents. Adds the architecture test that core and shared name no agent id. Generalizes the fake ACP agent to play a second agent through FAKE_ACP_* variables (on a go, Antigravity's auth method ids, mode ids, option ids and resume; on a no-go, a generic second agent), and on a go adds an antigravity pins file (archive URL and SHA-256 per OS, from the spike), checked by scripts/agent-pins.mjs. Every later entry builds on these shapes alone."
verify = "Contract tests parse every new shape and the old settings_changed payload; the architecture test fails on a planted agent id in core and in shared; a new chat for a missing or signed-out fake agent is refused with its code; terminal availability answers per session's agent; the agent list shows Claude Code's three modes and the fake second agent's declared ones; agent-pins --check passes on three OSes."
covers = ["E6-R1", "E6-R2", "E6-R5", "E6-R8"]
after = [2, "3.7"]
hitl = false
risk = "medium"
unknown = "Whether the standalone permission modes story has merged by then; this entry builds on its PermissionMode and AgentPort.permissionModes and waits on it once it is in the tree."
references = ["packages/shared/src/entities.ts", "packages/shared/src/setup.ts", "packages/server/src/terminal-availability.ts", "tests/fixtures/fake-acp-agent.mjs", "scripts/agent-pins.mjs", "tests/architecture.test.ts"]

[[entry]]
id = 4
type = "story"
title = "Move the shared ACP client out of acp-claude-code"
description = "Moves the agent-neutral parts of acp-claude-code/claude-code-agent.ts (ACP wiring, the session/update and AD-4 state mapping, the resume, load, then new reopen order, permission requests by option kind, session modes, auth_required, mask.ts and timeouts) into packages/adapters/src/acp-base, stopping processes through the existing process-tree.ts. acp-claude-code keeps only its spawn, auth methods, path fields, mode ids, terminal resume and transcript reader, and, on a go, the tracer's acp-antigravity moves onto the base. Claude Code's behaviour does not change. The base gains one rule: a permission request that offers neither an allow_once nor a reject_once option is cancelled and logged, never answered with another option."
verify = "Every existing Claude Code chat, resume, permission, mode and terminal test passes unchanged, acp-base names no agent and (on a go) shares no copied code with acp-antigravity, and a fake request offering only allow_always is cancelled and logged."
covers = ["E6-R3"]
after = [3]
hitl = false
risk = "medium"
references = ["packages/adapters/src/acp-claude-code/claude-code-agent.ts"]

[[entry]]
id = 5
type = "story"
title = "Antigravity chat: permission cards, modes, resume and the terminal toggle if supported"
description = "Completes acp-antigravity on the shared base. Its tool input fields map to card paths. Allow once and Deny pick the options of kind allow_once and reject_once, never a session-wide option. It declares and maps only the permission modes the spike matched (Ask always; Auto and Skip all only where its own modes mean the same), and a mode change it reports that asks less than the chat's mode drops the chat to Ask, as the permission modes story does for Claude Code. Reopen uses the order the spike found (session/resume, else session/load, else the stored-transcript fallback). terminalResume is added only if the spike showed the agy CLI resumes the ACP session id; otherwise the toggle reports agent_unsupported."
verify = "Against the fake agent's Antigravity personality, a shell command waits for its card, Always allow is enforced by core with no allow option sent to the agent, an undeclared mode is shown unavailable and refused, a chat continues after a server restart, and the terminal toggle matches the spike's result."
covers = ["E6-R4", "E6-R6", "E6-R1"]
after = [4, "3.8"]
hitl = false
risk = "medium"
unknown = "Whether Antigravity's own modes match Auto or Skip all closely enough to declare them, and whether it writes a transcript Ogden can import."

[[entry]]
id = 6
type = "story"
title = "Pick the agent per chat and the default per project"
description = "Builds the designed agent picker in the composer footer for new chats (installed and signed-in agents enabled, others with their reason and a link to Settings: Agents), the default agent in Workspace settings through PATCH settings and workspace.settings_changed, the agent named on every sidebar row, the session header and Needs you, Welcome offering every installed agent (Claude Code alone on a no-go, with no extra question) with the chosen one becoming the install default beside 10.4's default pieces; replaces the web's AGENT_ID and AGENT_NAME constants (chat-api.ts, sign-in-again.tsx, status-sidebar.tsx and the other users) with entry 3's agent list, shows the mode picker's choices from the session's agent, and makes the agent card and Sign in again generic: the card names the provider from the setup status and shows a sign-in URL or code when the setup adapter gives one, which entry 7 supplies on a go (closes the 9.2 Anthropic-wording deferral)."
verify = "Playwright against two fake agents: a new chat preselects the project's default, changing the default in one tab shows in another without a reload, a signed-out agent is shown disabled with its reason, every sidebar row names its agent, the mode picker lists only the session agent's modes, and grep finds no AGENT_NAME constant left in packages/web."
covers = ["E6-R1", "E6-R2"]
after = [3, "10.4"]
hitl = false
risk = "medium"
references = ["packages/web/src/chat/chat-api.ts", "packages/web/src/onboarding/welcome-model.ts", "packages/web/src/agents/agent-card.tsx", "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#component-patterns"]

[[entry]]
id = 7
type = "story"
title = "Antigravity install, sign-in and API key from the UI"
description = "Completes setup-antigravity behind AgentSetupPort. Install downloads the pinned archive for this OS into <dataDir>/agents/antigravity/, checks its SHA-256 and unpacks it; an existing copy found where the spike showed one lives is used only when its version and hash match the pin; nothing is installed globally. Sign-in uses Google login (oauth-personal; the user accepted the terms risk, 2026-10-02) by the route the spike chose, built only after the spike's terms re-check is in this plan with no unreviewed change, with the URL or code shown in entry 6's generic agent card. The API key goes through the keychain as agent-api-key/antigravity and reaches only Antigravity's process, by the route the spike found; key delivery lives only in setup-antigravity and entry 3's AGENT_ENV_KEYS, and acp-antigravity (entry 5) spawns with the environment the registry gives it, so the two never edit the same code; the setup status names Google as the provider. Enterprise methods (oauth-business, agent-platform) are not offered."
verify = "Against fake archive and login fixtures on three OSes, Settings: Agents installs Antigravity, refuses an archive whose hash does not match, reuses a matching existing copy, and signs in with each offered method; a saved key reaches only Antigravity's child process, and a scan of the database, the event log and the logs finds no key; live, a real Google sign-in and a real key each chat."
covers = ["E6-R5"]
after = [6]
hitl = false
risk = "high"
unknown = "Whether oauth-personal hands its URL to the client or only opens a browser itself, and where an existing copy of the server can be found and its version read."
references = ["packages/adapters/src/setup-claude-code/install.ts", "packages/adapters/src/setup-claude-code/api-key.ts"]

