description = "Cleans up code across the epic, scoped when it starts from the build records and the review findings deferred during the epic, with no behaviour change. It also runs the provenance check, keeps the deferred-work.md Open items index current, splits any file the epic grew past 600 lines (claude-code-agent.ts and setup-claude-code/install.ts are already listed), and removes the spike's CI job if it is still there."
verify = "All tests pass and no behaviour changes."
covers = []
