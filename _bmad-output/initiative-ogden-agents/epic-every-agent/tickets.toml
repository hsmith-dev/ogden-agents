[[entry]]
id = 10
type = "story"
title = "End-to-end suite and release"
description = "Extends the installed end-to-end suite, in CI on macOS, Windows and Linux against the packed package, to: install and sign into the fake Antigravity; run a Claude Code chat and an Antigravity chat at once in one Simple project; restart and resume; check each agent's declared modes; toggle the terminal where offered; and plan with Antigravity where Planning is on. Writes the final agent-matrix.md row for Antigravity from the spike and the live checks, through bmad-spec, leaving no verify cell. Then the user runs Antigravity's live checks on macOS and Windows (or the OSes the matrix lists) on npx ogden-agents@next, including a planning session with Antigravity running a BMad skill, records each result in the plan, and tags this epic's release through the release workflow."
verify = "The suite passes on all three OSes, and the tagged version from npm passes Antigravity's live Done when checks on the user's machines, each recorded under Live check result before the ticket moves to done."
covers = ["E6-R1", "E6-R2", "E6-R3", "E6-R4", "E6-R5", "E6-R6", "E6-R7", "E6-R8"]
after = [9]
