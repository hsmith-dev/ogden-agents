# Epic 26 breakdown (v1.3, everyday polish). Table order is the build order; ids never change once written.
# Drafted autonomously 2026-10-31 from change-desktop-ux-uplift section 4.4 (approved by the user 2026-10-31). References to other epics use "<epic id>.<entry id>".
# CI never uses a real agent, model, phone or network: fakes on loopback only. Live checks with real CLIs, agents and devices are hitl.
# Order after the set check (2026-10-31): 7 and 8 come right after the tracer bullet, since 8 is the least certain slice; ids keep the change proposal's numbering.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: Needs you rows show the request, and g y jumps to the next one"
description = "Makes each Needs you row two lines per EXPERIENCE.md (what it needs in full words, then project and chat, a kind glyph for permission, question, review and blocked run, five rows then Show N more), adds `g y` (open the next row's target after the one last opened, wrapping) and `]` and `[` inside the group to the existing keyboard handler, and reads today's browser-side Needs you list; when done, a person sees two waiting chats' requests in full in the sidebar and reaches each with `g y`; the row's fields (kind, what, where) are the shape 20.9's core model keeps, and entries 2 and 3 extend the same keyboard handler."
verify = "Playwright with two fake waiting chats in two projects reads both requests in full at the sidebar's width, opens the first then the second card with `g y` and wraps, and moves between rows with `]` and `[`; each row's accessible name reads both lines."
covers = ["E26-R1"]
after = ["2.11", "11.4"]
hitl = false
risk = "low"
references = ["_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#component-patterns", "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#interaction-primitives", "_bmad-output/initiative-ogden-agents/research-desktop-agent-ux/ogden-current.md#cross-cutting", "_bmad-output/initiative-ogden-agents/research-desktop-agent-ux/screens/04a-chat-permission-card.png"]

