[[entry]]
id = 8
type = "story"
title = "Always allow scoped to a command prefix (AD-40), with a security review"
description = "Brings the existing `command_prefix` scope in `permission-matching.ts` to AD-40: the card keeps today's scope first and offers \"Commands starting with `<prefix>`\" (the one-word or two-word prefix of the parsed command) second, as EXPERIENCE.md Flow 6 shows; the server refuses a match on any shell control character, redirection or protected path; the rule is saved with a `rule_` id and listed with Remove in entry 7's Settings; nothing is offered for custom agents, attended builds or a device, and Skip all writes no rule; a security review of the matcher and routes is run and its findings fixed or recorded."
verify = "Core tests allow `npm test -- --watch` under an `npm test` rule and refuse chained, piped, redirected, substituted and protected-path commands, and Skip all writes no rule; Playwright saves and removes a prefix rule; the security review's report is in the plan and the user has read it."
covers = ["E26-R8"]
after = [7, "2.6", "21.5"]
hitl = true
risk = "high"
unknown = "What today's first scope covers exactly (`alwaysAllowScope` already returns a prefix), so whether it becomes the exact command; the build starts from a gap list against AD-40 and settles the card's two labels with it."
references = ["_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-40--always-allow-can-be-scoped-to-a-command-pattern-adopted", "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#flow-6-reviewing-a-turn-and-sending-comments-lena-fischer-freelance-web-developer-monday-morning-on-a-clients-shop-frontend", "_bmad-output/initiative-ogden-agents/research-desktop-agent-ux/ogden-current.md#chat-mid-turn-with-a-permission-card"]

