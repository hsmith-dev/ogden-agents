[[entry]]
id = 9
type = "story"
title = "Unlink a board"
description = "Adds the Unlink action to the Jira link settings panel: a confirmation naming what happens (matching the link flow's permission-card-style confirmation), then deletes `jira-credential/<workspaceId>` from the keychain immediately (a direct read afterward finds nothing) and clears the workspace's site URL/email/board settings and stops entry 7's poller for that workspace at once; the tickets already synced in are left exactly as the ordinary local files and plans they already are — nothing is deleted from the ticket tree, and they remain buildable like any other local ticket, with no further Jira field mapping, conflict notices, or baseline applied to them from then on."
verify = "Unlinking in a test deletes the keychain entry (checked by reading it directly, not through the port), stops the poller (no further calls to the fake Jira server after unlink even past the interval), and leaves the previously synced tickets' files and plans unchanged and buildable; relinking the same workspace to a different board does not resurrect the old board's conflict notices or baselines."
covers = ["E18-R1", "E18-R3"]
after = [6]
hitl = false
risk = "medium"
notes = ["Decision (2026-10-07, this epic's inception): unlinking drops the project back to plain BMad Method mode (Planning/Board stay on, nothing else changes) rather than asking the user what to do next — resolving this epic's own open question from inception, since AD-28's local-file convention already answers what happens to the tickets (they stay local files) and nothing else needs a choice."]
