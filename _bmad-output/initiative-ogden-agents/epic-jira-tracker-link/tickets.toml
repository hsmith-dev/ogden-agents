# Epic 18 breakdown (drafted by autonomous inception, 2026-10-07, on branch feature/cap26-jira-tracker). Table order is the build order; ids never change once approved.
# Epic 18 starts after epic 10's BMad pieces contract and piece UI (10.2, 10.6), epic 4's TicketStorePort, tickets-v7 and Board (4.2 through its sweep, 4.12), and epic 9's SecretStorePort/secrets-keyring (9.2) and Welcome's project-creation step (9.5). References to other epics use "<epic id>.<entry id>".
# Lanes: entries 1-7 are one lane (the tickets-jira adapter: contracts, the outbound guard, auth/link, read, write, polling) touching packages/core and packages/adapters/src/tickets-jira in order. Entries 8-10 are a second lane in packages/web: entry 8 (conflict/status UI) opens once entry 6 lands and may run beside 7, 9 and 10; entries 9 (unlink) and 10 (the three-way picker) are sequential with each other (10 needs 9's Unlink action), not parallel.
# Live checks (entries 1 and 12) use a developer's own free Jira Cloud sandbox site and API token, in a scratch board, never a real team's Jira.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: link a Jira board, see one issue on the Board, approve pushes done"
description = "Adds the thinnest path through every layer this epic touches: a minimal link form (site URL, email, token) on a new Workspace settings panel that calls a core use-case making one live `GET /rest/api/3/myself` call before saving the token bare in the keychain under `jira-credential/<workspaceId>` (9.2's SecretStorePort) and the email/site URL as plain workspace settings; a minimal `tickets-jira` adapter behind `TicketStorePort` (4.2's contract) whose `tree`/`find` fetch one Jira project's issues over REST and map only title, body and status (AD-28) into the same shape `tickets-v7` returns, writing each new ticket's local file and plan the first time it is seen; a minimal poller that calls `tree` once on link and once more on a manual Refresh button (no interval timer yet); and approve (5.9's existing action) pushing the ticket's local `done` to the matching issue's Jira status over one REST call. The hitl step is the developer linking their own free Jira Cloud sandbox site and watching one issue appear on the Board, moving it through the UI, and approving a build pushes it to Jira's board."
verify = "Live on the developer's own Jira Cloud sandbox: linking the board shows one of its issues on the Board within the manual Refresh, and approving a ticket built from it marks the matching Jira issue done; in CI against a fake Jira server fixture (new, matching this repo's fake-server convention: tests/fixtures/fake-release-server, fake-openai-server.mjs), linking calls the fake server's /myself endpoint before saving, tree/find return the fake board's issues mapped to BMad tickets, and approve's done call reaches the fake server with the right issue key and status."
covers = ["E18-R1", "E18-R3", "E18-R4", "E18-R7"]
after = ["4.2", "9.2", "10.2"]
hitl = true
risk = "high"
unknown = "Whether a Jira Cloud sandbox site defaults to a classic or scoped API token and base URL shape (AD-29's two cases); record which the developer's sandbox used and that both code paths exist, even if only one is live-tested here."
references = [
  "packages/adapters/src/tickets-v7/index.ts",
  "packages/core/src/ticket-store-port.ts",
  "packages/adapters/src/secrets-keyring/index.ts",
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-27--jira-sync-is-polled-and-refresh-triggered-never-a-webhook-adopted",
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-29--jira-authentication-adopted",
]

[[entry]]
id = 2
type = "story"
title = "Epic contracts and stubs"
description = "Freezes in shared the full surface later entries fill: the Jira link settings shape (siteUrl, email, boardId or projectKey, linked boolean — no token), the link/test-call request and its error codes (jira_unauthorized, jira_unreachable, jira_url_rejected matching entry 3's guard, jira_already_linked), the sync-baseline shape per two-way field (AD-28, stored beside the ticket's plan file, never the database per AD-10), the conflict-notice shape (field, local value, Jira value, detected-at) a ticket carries, the sync-status shape (lastSyncedAt, lastError) a workspace carries, and the three-way `ProjectMode` enum (`simple` | `bmad_method` | `tooling_drive`) as a view computed from 10.2's existing `BmadPiece` set plus whether a Jira board is linked, not a new stored field (Simple = no pieces on, BMad Method = any piece on with no linked board, Tooling Drive = Planning and Board on with a linked board); extends `TicketStorePort`'s existing contract with no new methods (the same `tree`/`find`/`mark`/`watch` entry 1 already calls) and scaffolds the `tickets-jira` adapter package with `jira-memory` and `jira-link-memory` stubs plus a `fake-jira-server` fixture (new, under `tests/fixtures/`, matching `fake-release-server`'s and `fake-openai-server.mjs`'s shape: a tiny Node http server serving `/rest/api/3/myself`, `/rest/api/3/issue`, `/rest/api/3/search`, and the Data Center equivalents, with a `--tamper` style flag for unauthorized/rate-limited/malformed responses) so every later entry builds against the stub first, pre-registers every new route through 10.2's guarded route helper and the adapters-index wiring slot (user decision 2026-10-01's pattern, reused)."
verify = "Contract tests parse every new shape and error code; `jira-memory`/`jira-link-memory` drive every `TicketStorePort` method and the link use-case in a test; the fake Jira server answers `/myself`, `/issue` and `/search` with fixture data and `--tamper unauthorized|rate-limited|malformed` for each failure path; the route-registry test in `gate.test.ts` lists every new route behind the gate under `/api/v1/workspaces/:wsId`; a `ProjectMode` test proves it is computed, not stored, for a matrix of piece/link combinations."
covers = ["E18-R1", "E18-R2", "E18-R3", "E18-R7", "E18-R8", "E18-R9"]
