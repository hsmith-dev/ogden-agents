[[entry]]
id = 6
type = "story"
title = "Plan review UI: see every step, edit, approve, skip, reorder within prerequisites, stop"
description = "Replaces the tracer's fixed approval with the plan review: every step shown with its worker, chat, instruction, mode and prerequisites and where the manager runs (this computer or a named host); edit an instruction, approve, skip, reorder within the prerequisites, and a visible Stop; approvals are server-enforced per step in the default mode, an edit makes the step need approval again, and the manager can never approve for the user, change a worker's mode or use Skip all; plain states while the manager is thinking that never block the workers' chats."
verify = "A browser test with the fake manager reviews a three-step plan: editing a step requires a fresh approval, a skipped step never dispatches and its dependents wait, a reorder that breaks a prerequisite is refused, Stop halts the run, and a direct call that approves for the user without a user action is refused."
covers = []
