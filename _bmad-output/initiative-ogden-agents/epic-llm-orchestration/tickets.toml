type = "story"
title = "Team roster and roles in Settings: assign agents and models to manager, planner, worker, reviewer per project"
description = "Adds the roster UI and server routes on the `TeamRole` and `TeamRoster` types: per project, the user assigns each agent or model (the Local model on a configured endpoint, Claude Code, Antigravity, Codex, Grok) to manager, planner, worker or reviewer, one holder may have several roles, with an app-wide default for new projects and defaults when nothing is chosen (manager and planner the first ready model, workers the project's default agent, reviewer a different ready agent from the worker); an agent that cannot take a role shows why in plain words (not ready, no manager test passed, vendor terms, mode); the server checks every assignment, emits `workspace.settings_changed`, and the manager's roster in entry 4 is read from it."
verify = "Tests assign and clear each role, the defaults resolve for a fresh project and for one with the app-wide default changed, an agent not ready or a model that failed the manager test is refused for the manager role with its reason, Copilot CLI is refused as a worker, a direct API call that breaks a rule is refused, and the manager adapter addresses only rostered workers."
covers = []
