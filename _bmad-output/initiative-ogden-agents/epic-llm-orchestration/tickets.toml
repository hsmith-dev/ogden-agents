# Epic 15 breakdown (v2, LLM orchestration: a manager model tells other agents what to do). Table order is the build order; ids never change once written.
# Incepted autonomously 2026-10-05 on the user's approval of epic 15 and every recommended default (see the epic's Notes, Decisions). Open questions are in the epic's Notes.
# References to other epics use "<epic id>.<entry id>".
# Real models, real agents, the real keychain and the real network are impossible in CI: every test uses a fake manager (the memory `LocalModelPort` or the fake OpenAI-compatible server on loopback), fake workers (fake agents), and the existing test hooks (testHooksAllowed). The reliability of small local models as managers, and live runs with real workers, are the user's live checks (checklist in RELEASING.md), never CI.
# The user's rules (binding): the manager is any configured OpenAI-compatible endpoint (local-first recommended, not forced); it is a tool-free, schema-validated JSON call with no shell, files or credentials; never Skill-all or Skip all; never starts a build without the Build dialog; per-project roster of roles (manager, planner, worker, reviewer) with defaults; per-team mode "Approve each instruction" (default) or "Dispatch automatically", server-enforced; limits per run 20 instructions, depth 3, 30 minutes; a visible Stop and an activity log; Copilot CLI is never an autonomous worker; subscription agents are approve-each only until their terms are re-checked; cost and budget stay out.
# Lanes: 1 and 2 first (the fake manager and the contracts every later entry shares); 3 proves the whole path thin; 4 (adapter) and 5 (roster) can run in parallel after 3; 6 to 9 are one chain through the run entity and dispatch; 10, 11 and 12 can run in parallel after 9; 13 sweeps; 14 releases.
# Order follows the user's list: reliability harness, contracts, tracer, manager adapter, roster UI, plan review UI, dispatch and read-back, mode setting with Stop and limits, loop with pause, reviewer, builds through the Build dialog, routing profiles, sweep.

[[entry]]
id = 1
type = "story"
title = "Manager reliability harness: a fake manager that returns good, malformed and adversarial JSON"
description = "Adds the fixtures every later entry tests against: a scripted fake manager (a `LocalModelPort` stub plus a mode of the fake OpenAI-compatible server) that returns, on cue, a conforming plan, a conforming decision, JSON in prose or a code fence, truncated JSON, a wrong version, an oversize reply, extra and unknown fields, an off-roster agent id, a mode above Ask, a `skip_all` or credential-shaped field, a build or shell request, an instruction that tries to override Ogden's rules, a duplicate or cyclic step list, and a slow or hanging reply; plus a table of expected outcomes (accepted, repaired once, refused with a plain reason) as data, and a small CLI-free report function that tallies a model's valid-JSON rate over those cases and over three sample goals. The real-model measurement is not run in CI: the report function and a checklist for the user's live check (Mac and Windows, several model sizes, valid-JSON rate, plan quality, latency, the floor and go or no-go) go into RELEASING.md."
verify = "Unit tests show the fake manager yields each case on cue and the table lists the expected outcome of each; the report function over the fake returns the expected tally; RELEASING.md holds the live-check checklist; no test calls a real model or a real network."
covers = []
after = ["14.8"]
hitl = false
risk = "medium"
unknown = "Which quality floor (model size, context) makes a dependable manager; only the user's live run on real models answers it, so the epic builds against the protocol and leaves the floor as a setting and a recorded Decision."

[[entry]]
id = 2
type = "story"
title = "Contracts and stubs: manager protocol schemas, ManagerPort, orchestration run entity, events and the mode setting"
description = "Adds the shared contracts with no behaviour: `ogden.manager.plan.v1` (goal, steps of id, worker, chat reference or new, instruction up to a size cap, requested mode never above Ask, depends_on), `ogden.manager.decision.v1` (dispatch, ask_user, done, stop, each with a reason) and a status report (the worker's normalized state plus a capped, masked summary), each as zod with a JSON schema export for `structuredComplete`; the `OrchestrationMode` (`approve_each` default, `automatic`), the run limits (20 instructions, depth 3, 30 minutes) and the run and step entities with states; `orchestration.*` events (run started, plan proposed, step proposed, approved, edited, skipped, dispatched, result read, paused, stopped, finished, mode changed) as an AD-8 amendment proposed through a bmad-spec memlog, never hand-edited; the `ManagerPort` in core (propose a plan, decide the next step) with a fake; a drizzle migration (renumbered after what is on main) for the run, step and per-project orchestration columns; the `workspace.settings_changed` keys for the roster, mode and the Orchestration piece (default off); and an architecture test that core and shared name no model product and that nothing under orchestration imports a shell, file, or credential port."
verify = "Unit and architecture tests: every schema accepts its conforming sample and refuses each adversarial case from entry 1 with a plain reason; a mode above Ask, `skip_all` and unknown fields are refused by the schema; the migration applies on a fresh database and on one with every earlier migration; the stub manager satisfies the port's contract tests; with the Orchestration piece off the new routes are absent."
covers = []
after = [1, "14.3"]
hitl = false
risk = "medium"
references = ["architecture-ogden-agents/architecture-ogden-agents.md#ad-8"]

[[entry]]
id = 3
type = "story"
title = "Tracer bullet: a goal reaches a stubbed manager, a plan shows, one approved instruction reaches one worker chat, the status reads back"
description = "Adds the thinnest end-to-end path with the stubbed manager and a fake worker: a bare Orchestrate page behind the Orchestration piece (off by default, so Simple projects never see it), a goal box, the plan listed, one Approve on the first step that sends the instruction through the existing chat `sendMessage` into a worker chat (creating it with the worker's own default mode), and the worker's normalized state and a capped, masked result read back and shown; the roster, mode, limits and loop are fixed in code and replaced by entries 5 to 9. Dispatch is refused in code unless the step was approved."
verify = "A test with the fake manager and a fake agent turns a goal into a plan, a direct API call to dispatch an unapproved step is refused, approving the first step creates a worker chat whose transcript shows the instruction as sent by the manager at the user's approval, and the result reads back masked and capped; with the piece off the page and routes do not exist."
covers = []
after = [2, "6.6"]
hitl = false
risk = "high"
unknown = "How much of the dispatch path can reuse `sendMessage` and the handoff preview token as they are; the entry is rewritten if the chat layer needs a small seam for an instruction that is not typed by the user."

[[entry]]
id = 4
type = "story"
title = "The manager adapter: build the input from core's data, call structuredComplete, validate, repair once, honour the roster"
description = "Adds the real `ManagerPort` on `LocalModelPort.structuredComplete`: the input built by core each turn, capped to a budget set from the endpoint's reported context and never more than half of it (the goal, a short project summary, the roster of ready workers with their normalized states, and the capped, masked report of the last step, as a delimited data field; never file contents, secrets or diffs), the plan and decision schemas, validation of the answer, one repair retry that names only the schema error, a roster check that refuses an off-roster or not-ready worker, the plain-words failure kinds (malformed, off roster, too large, too slow, context too small, remote host not confirmed), and an event-log record of the masked output. A remote manager uses epic 14's per-endpoint confirmation and its key never enters the prompt or the logs. Worker text is untrusted data in a delimited field and never instructions."
verify = "Against the fake server and the entry 1 cases: good JSON is accepted, malformed JSON is repaired once or refused with its reason, every adversarial case dispatches nothing, a worker's output saying to ignore the rules changes no step, the input never contains a key, a file body or a path outside the project, an oversize input is cut to the cap, and a non-loopback endpoint with no confirmation is refused; core and shared still name no vendor."
covers = []
after = [3]
hitl = false
risk = "high"
unknown = "What each server honours for structured output (json_schema, json_object, prompt only); the adapter records the mode that worked and always validates after the fact."

