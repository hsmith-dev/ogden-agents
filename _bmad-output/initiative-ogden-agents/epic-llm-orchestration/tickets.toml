hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Dispatch and read-back across workers: handoff and send-message dispatch, masked status, refusal paths"
description = "Completes dispatch to every worker: an approved instruction becomes a send-message in the worker's chat, or a new chat, through the existing chat use-cases and, where a chat changes agent, the handoff brief with its single-use preview token (masked and capped); a worker's vendor terms are applied in code (Copilot CLI is never dispatched, subscription agents are approve-each only until their terms are re-checked, Codex and Grok are API-key workers); the read-back gives the manager the worker's normalized state and a capped, secret-masked summary of its last output and tool calls; refusals (worker not ready, chat busy, driver is the terminal, trust) are reported to the manager as plain results and dispatch nothing."
verify = "With fake Claude Code, Antigravity, Codex and Grok agents a test dispatches an approved instruction to each, the transcript shows who sent it, a secret in a worker's output is masked in the read-back, an over-long output is capped, and each refusal path leaves every chat unchanged and tells the manager why."
covers = []
after = [6, "12.11"]
hitl = false
risk = "high"

[[entry]]
id = 8
type = "story"
title = "Orchestration mode, Stop and per-run limits: Approve each instruction or Dispatch automatically, plainly labelled, server-enforced"
description = "Adds the mode toggle per project with an app-wide default, plainly labelled, changeable any time in Settings; switching to automatic is confirmed once per project and recorded in the event log like AD-15's Skip all confirmation; in the default mode a dispatch without approval is refused in code, in automatic mode the run dispatches within its limits (20 instructions, depth 3, 30 minutes, adjustable) and stops at the first refusal, error or limit; subscription agents stay approve-each only in automatic mode, with the reason shown; a visible Stop halts the run and cancels the worker's current turn; an activity log lists every dispatched instruction (who, to which worker and chat, when, result)."
verify = "Tests with the fake manager and fake workers: a default-mode dispatch with no approval is refused through the API, automatic mode needs its one confirmation, the run stops at 20 instructions, at depth 3 and at 30 minutes (a fake clock), Stop cancels the worker's turn and ends the run, the activity log matches the dispatched instructions, and flipping the mode back mid-run returns the next step to needing approval."
covers = []
after = [7]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "The loop: next-step decisions, stop on error, Deny or limit, pause on a worker's unanswered card, resume after a restart"
description = "Closes the loop: after each result core asks the manager for the next decision (dispatch, ask the user, done, stop), a refusal, an error, a Deny of a worker's permission card or a limit ends the run and tells the manager when it matters; an unanswered permission card in a worker chat pauses that step and the run waits for the user, who answers on the worker's own card (the manager can never answer one); the events are the log, so a run resumes after a restart in the state it was in and never re-dispatches an instruction already sent."
verify = "Fake manager and fake workers: a requested shell command waits on its card and the run pauses, Deny ends the step and the manager is told it was denied, a restart mid-run resumes at the same step without a second dispatch, the manager's `ask_user` waits for the user, `done` finishes the run, and nothing in the loop ever changes a worker's mode."
covers = []
after = [8]
hitl = false
risk = "high"

