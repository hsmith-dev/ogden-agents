[[entry]]
id = 7
type = "story"
title = "Document cards and the next suggested step"
description = "Detects in core when a planning session writes a BMAD document (a completed write tool call into the workspace's output folder) and emits entry 2's planning document event, using the output folder from entry 2's setup status, and renders it in the session view as a document card with Open and the next suggested step from entry 4's catalog (catalog-memory until entry 4 lands) as a button that starts the next planning session on that document (for example Turn this spec into tickets)."
verify = "Against the fake ACP agent writing a spec file into a fixture repo, the transcript shows one document card with Open and Turn this spec into tickets, the card survives a reload, and the button opens a new planning session whose first message names the document; a write outside the output folder shows no card."
covers = ["E4-R6"]
after = [4, 6]
hitl = false
risk = "high"
unknown = "What Open does in v1 (in-app viewing is epic 8); documents are found from the session's write tool calls, not from entry 8's watcher."
references = ["_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#key-flows"]

[[entry]]
id = 8
type = "story"
title = "Live ticket index from file watching"
description = "Completes the tickets-v7 adapter behind entry 2's TicketStorePort: watches the workspace's output folder in the main checkout (never worktrees) with debounced fs.watch, reruns tickets.py status via the uv runner, diffs against the last index and has core emit ticket.changed with only workspaceId and ref for each changed ticket (the refresh entries 9 and 10 rely on), rebuilds the index on start or when thrown away, runs only for workspaces with Board on, started and stopped on workspace.settings_changed (AD-22, user decision 2026-10-01), and serves the tree and find over REST; the database stores ticket refs only."
verify = "Against a fixture repo, writing status: in-progress into a plan file emits one ticket.changed for that ref within 3 seconds and the REST tree shows the new status; editing tickets.toml adds the new entry; deleting the index rebuilds it identically; a worktree folder inside the repo is not watched; turning Board off stops the watcher and turning it on starts it; no ticket status column exists in the database."
covers = ["E4-R7"]
after = [2]
hitl = false
risk = "medium"
unknown = "Whether recursive fs.watch is reliable enough on Linux and Windows for within seconds, or a polling fallback is needed."
notes = [
  "From the epic 9/3 retros (2026-10-01, user approved): before building the watcher, probe recursive fs.watch on windows-latest and ubuntu-latest in CI (latency, missed events, rename storms) in a temporary job, record the facts with run ids, and remove the probe before review, as 3.8 did; it answers this entry's unknown (epic 3 retro A8, L2).",
]
references = ["_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-10--ticket-state-lives-only-in-the-bmad-files-adopted"]

