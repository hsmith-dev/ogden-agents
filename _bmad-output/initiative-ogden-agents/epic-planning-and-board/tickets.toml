# Epic 4 breakdown (approved by the user 2026-10-01; drafted by autonomous inception). Table order is the build order; ids never change once approved.
# Epic 4 starts after epic 1's bundled forks (1.9) and uv bootstrap (1.8) and epic 2's session view (2.10), all built, and after epic 10's BMad pieces contract (10.2, user decision 2026-10-01). References to other epics use "<epic id>.<entry id>".
# Live checks use the developer's existing Claude Code login or an API key saved through 9.2, in a scratch repo, never Ogden Agents's own repo.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: one planning session and a bare board in a repo with BMAD"
description = "Adds a minimal uv script runner adapter (runs a bundled-fork Python script in a workspace folder, allowlisted environment, time limit, JSON result), a minimal BmadCatalogPort and bmad-catalog adapter listing the workspace's installed skills from SKILL.md frontmatter, a minimal TicketStorePort and tickets-v7 adapter returning `tickets.py status` for the workspace, a core use-case that creates a session of kind planning and sends a first message that starts a chosen skill for the user, who then answers in the chat (the invocation formatted by the agent adapter, user decision 2026-10-01), REST routes for both, and bare /w/:wsId/plan (a skill list with a Start button) and /w/:wsId/board (a flat ticket list) pages; the hitl step is the developer's live run in a scratch repo that already has the fork's _bmad installed and Planning and Board turned on (AD-22, user decision 2026-10-01)."
verify = "Live on the developer's machine, starting bmad-spec from the bare Plan page opens a planning session in which Claude Code runs that skill, and the bare Board page lists the scratch repo's tickets with their states; in CI against the fake ACP agent and a fixture repo, the planning session is created with kind planning and its first message names the skill, and GET on the board route returns the fixture's tickets with the status and state tickets.py reports for each."
covers = ["E4-R1", "E4-R3", "E4-R5", "E4-R7"]
after = ["1.8", "1.9", "2.10", "10.2"]
hitl = true
risk = "high"
unknown = "How Claude Code is told to run a skill from an ACP first message (slash command or plain request) and whether the skills setup copies are found from the workspace folder; record both in the build record."
references = [
  "_bmad-output/initiative-ogden-agents/spec-ogden-agents/bmad-integration.md",
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-12--bmad-is-discovered-not-hard-coded",
]

[[entry]]
id = 2
type = "story"
title = "Epic contracts and stubs"
description = "Freezes in shared the catalog shape (modules, skills, agents, groups, label, description, entry action, installedAt for the New tag, capability flags), the planning-session create request (kind planning, action id, optional idea text), the ticket tree REST shape taken from tickets.py status and find JSON, including its problems list, with the board column each plan `status` maps to and `state: planned` for an entry with no plan, the mark request and its error codes (status_not_allowed for done, tickets_unavailable, bmad_not_set_up, reduced_mode; feature_off is 10.2's), the BMAD setup status shape (including the configured output folder, so core reads no BMAD config) and setup progress events, the ticket.changed event (workspaceId and ref only, AD-7), and the planning document event a session emits when it writes a BMAD document; extends 10.2's BmadCatalogPort and shared shapes rather than creating them (adding catalog, setup status, setup), completes TicketStorePort (tree, find, mark, watch) and the uv runner with catalog-memory and tickets-memory stubs and a fixture repo, registers planning and board as available pieces, and pre-registers every new route through 10.2's guarded route helper and every adapter wiring slot in the server and adapters index so later entries only fill them (user decision 2026-10-01), so the setup, catalog, planning UI, ticket index and board lanes open at once. Every shared shape, including user-facing reasons and close codes, lives in shared (epic 3 retro A2)."
verify = "Contract tests parse every new shape, request, error code and event; the memory stubs drive every port method in a test; a runner test shows only the allowlisted environment reaches the script, the time limit stops a hung script, output streams, and a missing uv or a non-zero exit becomes a plain error; the route-registry test in gate.test.ts lists every new route behind the gate under /api/v1/workspaces/:wsId, and 10.6's guard-coverage test passes with every piece route registered through 10.2's helper."
covers = ["E4-R1", "E4-R2", "E4-R3", "E4-R6", "E4-R7", "E4-R8", "E4-R9", "E4-R10"]
after = [1]
hitl = false
risk = "medium"
unknown = "Which board column a planned entry and a dropped ticket map to (the UX columns omit both); the draft assumes Draft and a hidden filter."
notes = [
  "From the epic 9/3 retros (2026-10-01, user approved): a reviewed story: its review is recorded in the plan's Review Triage Log with lenses_ran filled (epic 3 retro L1).",
  "From the epic 9/3 retros (2026-10-01, user approved): owns the epic's fakes and fixtures (the fixture repo, tickets-memory, catalog-memory, any fake tickets.py or uv runner), which behave like the real program in process count, stdin mode and timing; a timeout test against a fake says what real cost it stands for (epic 3 retro A9, L3).",
]
references = ["_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#component-patterns"]

[[entry]]
id = 3
type = "story"
title = "Set up BMad Method in a project from the UI"
description = "Runs the bundled fork's bmad setup (skills/bmad/scripts/setup.py, and --status for the check) through entry 2's uv runner against the workspace folder, copying skills from the package for Claude Code only (other agents in epic 6, user decision 2026-10-01; the bmad-catalog adapter may name the bmad setup skill per the AD-12 note), streams entry 2's setup progress events to a progress list, answers setup's config questions with defaults (the epic's setup assumption), started when the user turns on the first piece in a project without _bmad/ (from 10.5's BMad Method section) and also offered when a piece is on but _bmad/ is missing, and shows the result: a Set up panel component (not-set-up state, Set up button, progress list) placed on the tracer's Plan and Board pages only when their piece is on (AD-22, user decision 2026-10-01), the project reporting current afterwards, and Workspace settings shows the status with an update when the bundled fork is newer; chats keep working without BMAD; entries 6 and 9 keep the panel when they replace those pages, and entry 11 reuses this setup call for Upgrade this project."
verify = "Against a fixture empty repo in CI on all three OSes, turning on Planning in Workspace settings starts setup, and Set up ends with setup.py --status reporting current and the progress list showing each step; a setup that fails (uv missing, unwritable folder) shows its plain error and leaves chats working; Workspace settings shows the status."
covers = ["E4-R1", "E4-R2"]
after = [2]
hitl = false
risk = "medium"
unknown = "Which config questions setup.py asks and whether defaults are right for a non-developer; whether npx skills is needed for updates or setup.py covers them."
references = [
  "vendor/bmad-method/skills/bmad/scripts/setup.py",
  "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#state-patterns",
]

