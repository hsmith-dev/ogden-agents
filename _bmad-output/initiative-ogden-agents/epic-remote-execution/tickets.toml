# Epic 19 breakdown (chat and build with an agent on another machine over SSH, CAP-24). Table order is the build order; ids never change once written.
# Drafted autonomously 2026-10-07 (no live user in this session; bmad-ticket's Autonomous mode). Gaps are Notes in the epic file, not silent guesses.
# AD-24 and AD-26 are [ADOPTED]; AD-25 (multi-machine fan-out) is explicitly NOT adopted (see the epic's Notes). Entries 01-07 rest only on AD-24/AD-26. Entry 08 is AD-25's own scope and is sliced but left unbuilt and blocked.
# Tests never touch a real SSH network, a real remote machine, or the real OS keychain: every test uses a fake SSH/remote-host adapter (mirroring secrets-keyring.test.ts's fake-keyring-module pattern and tests/fixtures/fake-acp-agent.mjs's fake-process pattern) plus the memory secret store. What only a real machine can show (a real host-key prompt against a real sshd, a real cross-OS agent CLI) is each story's own hitl live check.

[[entry]]
id = 1
type = "story"
title = "RemoteHostPort: the remote-machine registry, with no real SSH yet"
description = "Adds the new install-level core port `RemoteHostPort` (packages/core/src/remote-host-port.ts, following the existing *-port.ts convention: a vocabulary-free interface plus a RemoteHostError extends CoreError) and the domain logic to add, list, rename and remove a remote machine (RemoteMachineId, prefix mach_, per the architecture's id-prefix note), install-level state (not workspace-scoped, like an agent's own sign-in) persisted in the database. A machine record holds only non-secret fields (host, port, username, display name, pinned host-key fingerprint, keypair public key, status) — no credential lives on this record; that is entry 02. Server wiring follows start-agents.ts's StartOptions escape-hatch pattern (an overridable options.remoteHost slot). A fake, in-memory RemoteHostPort stands in for every other story's and this epic's own tests."
verify = "Unit tests in packages/core/test add, list, rename and remove a machine; removing a machine that has no stored credential is a no-op on SecretStorePort (nothing to clean up yet); the port's own architecture test (core/shared name no SSH library, following the existing vcs-port.ts/agent-port.ts convention) passes; a machine's non-secret record never includes a credential field."
covers = ["R1", "R7"]
after = ["epic-chat-and-workspaces"]
hitl = false
risk = "low"
references = ["architecture-ogden-agents/architecture-ogden-agents.md#ad-1 (RemoteHostPort note)", "architecture-ogden-agents/architecture-ogden-agents.md#ad-9 (machineId/mach_ note)"]

[[entry]]
id = 2
type = "story"
title = "SSH credential storage, keypair generation, and host-key confirm-and-pin"
description = "Adds the `remote-host-ssh` adapter's security-critical core: generating and owning a fresh Ed25519 keypair per machine (this epic's resolution of AD-26's open keypair-ownership question — Ogden generates and owns it, never reads the user's own key), storing the private key (and passphrase if any) through SecretStorePort under remote-machine-ssh/<machineId> exactly as AD-16 stores agent API keys, and the host-key verification flow: connect, compute and surface the fingerprint, and refuse to mark the machine usable until an explicit confirm (mirroring AD-15/permission-mode.ts's confirm: true gate — a ConfirmationRequiredError absent it) is recorded as a logged core event and the fingerprint is pinned per machine in Ogden's own store (never only ~/.ssh/known_hosts); a later connection whose host key changed is refused outright, never silently re-prompted. Extends mask.ts's secret redaction (SECRET_ENV_NAME / secretValues / maskSecrets) to SSH private-key and passphrase formats so an SSH adapter's output can never leak one into an event or log line. Verifies AD-26's own flagged unknown: whether a generated private key fits the OS keychain's blob size on all three OSes; where it does not (Windows Credential Manager's documented ~512-2560 byte ceiling), falls back to keeping only a reference/passphrase in the keychain with the key material on disk under the user's own file permissions, the same posture as acp-codex/acp-grok's CODEX_HOME/GROK_HOME fallback (never a second generic encrypted-file secret store, since AD-16 explicitly removed that)."
verify = "Unit tests (fake SSH transport, no real network) cover: a new machine gets a freshly generated keypair never derived from or equal to any existing user key; the private key is never returned by any method other than the one call that hands it to the real outbound SSH connection; attempting to use a machine before its host key is confirmed is refused; confirming records one logged event and pins the fingerprint; a second connection with a changed host key is refused outright, not re-prompted; the key/passphrase never appears in a rendered event, log line or error message (a redaction test that scans every emitted event/log for the known key material); on a platform where the keychain write is simulated to exceed the size ceiling, the fallback path is used and still passes the no-leak test. Live check (hitl): a real add-machine flow against a real sshd on at least one of macOS/Linux/Windows, confirming the real OS keychain accepts (or correctly falls back for) a real generated key, before this entry counts as proven beyond the fakes."
covers = ["R5", "R6"]
after = [1, "epic-first-run-onboarding"]
hitl = true
risk = "high"
unknown = "Whether a generated Ed25519 private key in OpenSSH PEM form actually exceeds Windows Credential Manager's blob ceiling in practice (AD-26's own flagged unknown) — resolved empirically by this entry's live check, not assumed either way before then."
references = ["architecture-ogden-agents/architecture-ogden-agents.md#ad-26", "packages/core/src/secret-store-port.ts", "packages/adapters/src/secrets-keyring/index.ts", "packages/core/src/chat/permission-mode.ts (confirm: true precedent)", "packages/adapters/src/acp-base/mask.ts"]

[[entry]]
id = 3
type = "story"
title = "Settings: add, confirm and manage remote machines"
description = "Adds the remote-machine-linking UI in Settings: an 'Add machine' form (host, port, username, display name), a blocking host-key confirmation card modeled structurally on PermissionCard/the Skip-all AlertDialog (pending -> resolved two-state render, data-testid conventions, no default focus on the confirm action, the public key and its exact authorized_keys line shown with a copy action since Ogden cannot install it on the user's behalf), a list of added machines with connection status and a Remove action, and the plain-language refusal copy for a refused (changed) host key. New copy follows the no-dashes convention already used elsewhere in Settings."
verify = "Component tests (packages/web) and a Playwright e2e spec (tests/e2e) against the fake RemoteHostPort/SSH adapter: adding a machine shows the fingerprint and the exact public key line, the machine is unusable until Confirm, Confirm records the pin and collapses to a one-line record exactly like a resolved permission card, a machine whose host key the fake adapter reports as changed is shown refused with plain-language copy and no re-prompt, and Remove deletes the machine's stored credential (verified by asserting SecretStorePort.get returns undefined after)."
covers = ["R6"]
after = [1, 2, "epic-first-run-onboarding"]
hitl = false
risk = "medium"
references = ["packages/web/src/permissions/permission-card.tsx", "packages/web/src/permissions/permission-mode-picker.tsx"]

[[entry]]
id = 4
type = "story"
title = "Worktree streaming over SSH: push the run's worktree, pull back the diff"
description = "Adds the AD-24 push/pull step: before a remote run starts, the run's already-created local worktree (AD-17, unchanged) is streamed to a fresh per-run directory on the remote machine (namespaced by the run's own id under one fixed base path) over the same SSH connection used to spawn the agent, by a binary-safe mechanism (git archive or a bundle, never a plain non-binary diff) piped through the session — never a second transport, and the remote never receives a credential to the project's origin remote. After the run, the remote's resulting diff is read back the same way before the run's outcome is recorded. The remote directory is removed on a terminal outcome unless the user keeps it for debugging, mirroring the local worktree-in-data-dir lifecycle. A retry always re-syncs to a fresh remote directory, never hot-patching a previous one."
verify = "Unit/integration tests against a fake remote-host transport: pushing a worktree with binary files (not just text) round-trips byte-identical on the fake remote; two runs targeting the same machine at once get distinct remote directories and never collide; the remote directory is removed once the run reaches a terminal outcome; a retry creates a fresh remote directory rather than reusing the prior one; the push/pull step never passes or needs an origin-remote credential. Live check (hitl): a real push/build/pull-back against one real remote machine, confirming a binary file in the diff survives the round trip."
covers = ["R2", "R3"]
after = [2, "epic-unattended-builds"]
hitl = true
risk = "high"
references = ["architecture-ogden-agents/architecture-ogden-agents.md#ad-24", "packages/core/src/vcs-port.ts", "packages/adapters/src/vcs-git/index.ts", "packages/core/src/build-start.ts"]

[[entry]]
id = 5
type = "story"
title = "Spawn the agent's ACP process over SSH for interactive chat"
description = "Adds the remote launch seam at the AgentPort level: a new AcpLaunch variant (or a wrapping quirk) that, instead of a local child_process.spawn, opens the agent's ACP process on the chosen remote machine over the SSH connection (its stdio piped through the SSH session's own channel) and otherwise reuses createAcpAgent, the permission-card machinery and the event log completely unchanged — a remote chat session looks identical to a local one in every event the UI sees. Process lifecycle (start, crash/interrupted, Stop/kill) maps onto the SSH channel's own lifecycle: a channel close is treated the same way a local child 'exit' is today, and Stop closes the SSH channel/kills the remote process rather than a local process group."
verify = "Unit/integration tests with a fake SSH transport standing in for the real network (mirroring tests/fixtures/fake-acp-agent.mjs's approach, with the fake agent's stdio piped through a fake channel instead of a real local pipe): a chat session starts, streams messages, shows and resolves permission cards, and resumes, all through the fake remote channel with no code path differences visible to the session/event-log layer; a channel closing unexpectedly is reported exactly like a local crash (fatal state event, AgentError('agent_failed')); Stop ends the remote process. Live check (hitl): a real interactive chat against a real agent CLI on a real second machine over SSH, on at least one non-macOS OS."
covers = ["R1", "R8"]
after = [2, "epic-chat-and-workspaces"]
hitl = true
risk = "high"
references = ["packages/adapters/src/acp-base/acp-agent.ts", "packages/adapters/src/acp-claude-code/claude-code-agent.ts"]

[[entry]]
id = 6
type = "story"
title = "Unattended builds on a single remote machine, with connection_lost handling"
description = "Wires entries 04 and 05 into the build path: a build's target machine (null for local, a RemoteMachineId otherwise) flows through Run (an optional machineId field on Run per the architecture's AD-9 note, null for a local run), build-start.ts streams the worktree to the chosen machine before invoking the runner, the remote's own per-OS sandbox and HITL rule apply exactly as epic 5's single-machine model (no behavior change to the sandbox/permission rules themselves, only where the process runs), and the diff is read back before verification. Adds the new connection_lost value to shared's BLOCKED_CODES (with its BLOCKED_SENTENCES entry, matching the existing interrupted precedent) and the handling in build-start/run-outcome code: an SSH connection dropping before a terminal outcome records the run blocked/connection_lost, never running indefinitely and never guessed verified (the same posture AD-3 takes for a local crash, interrupted); the server attempts to reap the remote agent process on reconnect, and failing that the run stays blocked until the user retries, which always re-syncs a fresh worktree (entry 04)."
verify = "Integration tests (fake remote-host + fake SSH transport): a build dispatched to a remote machine creates the local worktree, streams it, runs under the fake remote sandbox, reads the diff back, and Approve merges from the controller's own checkout exactly as a local run (byte-identical to the equivalent local-run test, asserted by reusing epic 5's existing build fixtures with machineId set); simulating a dropped connection mid-run yields outcome blocked with blockedCode connection_lost, never verified; retrying after a drop re-syncs a fresh remote directory and a fresh worktree-id; a remote build's HITL/permission-card behavior is asserted identical to the equivalent local build's existing test. Live check (hitl): a real unattended build run end to end on one real remote machine of a different OS than the controller, approved and merged locally."
covers = ["R2", "R3", "R4", "R8"]
after = [4, 5, "epic-unattended-builds"]
hitl = true
risk = "high"
references = ["packages/shared/src/build-runs.ts (BLOCKED_CODES, BLOCKED_SENTENCES)", "packages/core/src/build-start.ts", "architecture-ogden-agents/architecture-ogden-agents.md#ad-24"]

[[entry]]
id = 7
type = "story"
title = "Choose a remote machine as a chat or build target, end to end"
description = "Adds the user-facing target picker that ties the whole single-machine path together: the workspace/chat agent picker and the Build dialog both gain a target-machine choice (local, or one of the confirmed machines from entry 03) alongside the existing agent choice, with an unavailable machine (connection refused, host key changed, no sandbox quirk for that OS/agent combo per agent-matrix.md's existing rule, AD-17's) shown with its plain reason exactly like an unavailable agent is today; resume/reconnect UX for a chat whose SSH connection dropped (offering Retry, matching the existing sign-in-again/resume patterns); and this entry's own refactor/consolidation pass (any file over this repo's existing size convention split, per the epic-12/epic-17 precedent of a dedicated sweep entry) plus updated agent-matrix.md documentation of remote eligibility."
verify = "Component and e2e tests: a chat or Build action offers the confirmed machines plus local, an unavailable machine shows its plain reason and cannot be chosen, choosing a remote machine starts the session/run against it exactly as entries 05/06 proved, a dropped remote chat connection offers Retry and resuming reconnects over a fresh SSH session, and the full single-remote-machine path (add machine, confirm host key, chat, build, approve) passes one end-to-end Playwright spec against the fakes. pnpm typecheck, pnpm test and pnpm e2e are green for the whole epic at this entry."
covers = ["R8"]
after = [3, 6, "epic-chat-and-workspaces"]
hitl = false
risk = "medium"
references = ["spec-ogden-agents/agent-matrix.md"]

[[entry]]
id = 8
type = "story"
title = "[BLOCKED on AD-25 adoption] Multi-machine fan-out, one authored diff verified per machine, aggregated review"
description = "AD-25 (one authored Run, verified independently as N ordinary Runs sharing a fanOutId, a diverging verification machine blocked/diverged_from_authored_diff and surfaced as context, Approve refused unless every member Run is verified) is proposed but explicitly NOT adopted in the architecture document: its own text reads 'Left unmarked, not [ADOPTED] ... Confirm this reading before a build ticket is written against it.' This entry is sliced now, matching CAP-24's full scope, so the epic's breakdown is complete and visible, but it is deliberately left unrefined and unbuilt. Do not pull or build this entry until a human (not an implementing agent) has confirmed AD-25's reading in the architecture document — or adopted a revised version of it — the same way AD-26 itself needed the user's explicit sign-off before a build ticket could cite it."
verify = "Not applicable until AD-25 is adopted. Once it is: a ticket fanned out to N confirmed machines produces N ordinary Runs sharing one fanOutId, each independently verified against the AD-24-synced worktree; a diverging verification machine's outcome is blocked/diverged_from_authored_diff with its own diff attached as context, never merged; the combined review is a fetched read model (no new event type) available once every member Run reaches a terminal outcome, with live per-machine progress (including that machine's own permission card) until then; Approve is refused unless every member Run is verified; a failed/blocked member can be retried alone without re-running the others."
covers = ["R9"]
after = [6, 7]
hitl = true
risk = "high"
unknown = "Entirely gated on whether a human adopts AD-25 as proposed, adopts a revised version (e.g. the N-independently-authored-diffs reading AD-25's own Notes say the spec's wording could also support), or defers CAP-24's multi-machine framing past this epic. No engineering judgment call substitutes for this one; it changes the data model (fanOutId, per-run outcome semantics) and the aggregation UI's whole shape."
references = ["architecture-ogden-agents/architecture-ogden-agents.md#ad-25 (proposed, not adopted)"]
notes = ["Blocked: AD-25 is not adopted. This entry stays planned until a human confirms AD-25's reading (or a revision of it) in the architecture document. See the epic's own Notes for the full flag."]
