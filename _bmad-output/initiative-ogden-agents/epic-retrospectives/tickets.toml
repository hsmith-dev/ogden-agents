# Epic 7 breakdown (approved by the user 2026-10-02; drafted by autonomous inception). Table order is the build order; ids never change once approved.
# Epic 7 starts after epics 4 and 5 (planning sessions, document cards, board, VcsPort, approve) and epic 10's pieces contract (10.2); its release follows epic 6's. References to other epics use "<epic id>.<entry id>"; epic 5's entries (5.9, 5.11) live on docs/epic-5-inception, so this file waits on the whole epic 5 ("epic-unattended-builds") until that branch merges, then on 5.9 (entry 1); entry 7 waits on the whole epic 6 until its release entry exists.
# Live checks use the developer's existing Claude Code login or an API key saved through 9.2, in a scratch repo, never Ogden Agents's own repo.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: look back on one finished epic from the board"
description = "Adds a bare Look back button on one epic group of the board that calls a minimal core use-case guarded by requireBmadFeature(workspaceId, 'retrospectives') and the 4.2 script trust, which creates a session of kind planning through 4.2's planning-session internals whose first message invokes the bmad-retrospective skill on the epic's folder (formatted by the agent adapter, AD-12), one route registered through bmadPieceRoutes, and retrospectives registered as available for the scratch run; the session runs interactively in the session view and ends with epic-<slug>-retrospective.md in the epic folder and 4.7's document card; the hitl steps are the user approving this epic's spec, architecture and UX deltas before the build starts (done: approved by the user 2026-10-02 and applied), and the developer's live run in a scratch repo with a finished epic and Board and Retrospectives on; the skill name appears only in the agent adapter or a test fixture (AD-12) until entry 4 starts it from the catalog's epic-scoped action."
verify = "Live on the developer's machine, Look back on a finished epic opens a planning session in which Claude Code runs the retrospective skill and the retrospective file appears beside the epic with a document card in the transcript, recorded in the plan; in CI against the fake ACP agent and a fixture repo, the session is created with kind planning and its first message names the epic folder, the route answers feature_off with Retrospectives off and scripts_not_trusted without trust."
covers = ["E7-R1", "E7-R2", "E7-R4"]
after = ["4.7", "4.9", "epic-unattended-builds", "10.2"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
unknown = "Whether the skill, started from an ACP first message, finds the epic from its folder path and runs its uv pre-pass and bmad-review subagents behind permission cards without a terminal, how long a real look-back takes, whether 4.7's write detection makes one card or several as the skill fills its document phase by phase, and whether session routes for a planning-kind session assume the Planning piece is on; record each in the build record."
references = [
  "vendor/bmad-method/skills/bmad-retrospective/workflow.md",
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-22--bmad-method-is-opt-in-per-workspace",
]

[[entry]]
id = 2
type = "story"
title = "Epic contracts and stubs"
description = "Freezes in shared the look-back start request (epic folder), the next-step start request (catalog action plus retrospective file) that entry 5 uses, the epic row's retrospective summary added to 4.2's TicketEpic (verdict accepted, accepted-with-open-items or rejected, date, path, or null, plus a problem line when unreadable) and the finished-epic offer state with its dismiss request, the per-run build summary handed to the look-back (ticket ref, outcome, verification result, blocked reason, duration; never a transcript; user decision 2026-10-02) with a run-records read and memory stub, the save-the-lessons request and response with its error codes (nothing_to_save, checkout_busy) and plain messages, and the catalog additions (an epic scope on an action and an additive list of further next steps beside 4.2's single next); adds commitPaths to epic 5's VcsPort with a memory stub, the verdict read to TicketStorePort with tickets-memory support, and the per-epic offer dismissal to core, freezes how a retrospective file's change reaches the board (4.8's watcher also matches *-retrospective.md and emits a refresh for its epic, since no ticket row changes), pre-registers every new route through bmadPieceRoutes guarded by retrospectives, each use-case and route in its own file so entries 4 and 5 do not collide, leaving the verdict read and dismissal for entry 4 and commitPaths in vcs-git for entry 5 to complete, adds retrospectives to SHIPPED_BMAD_PIECES, and changes the dependency rule to retrospectives needs board (user decision 2026-10-02) in BMAD_PIECE_INFO and 10.2's dependency table test; owns the epic's fixture repo (a finished epic with plans, commits, a retrospective file and AGENTS.md), the fake agent's retrospective and AGENTS.md writes, and every fake, which behave like the real program. Every shared shape, user-facing reason and code lives in shared (epic 3 retro A2)."
verify = "Contract tests parse every new shape, request, error code and catalog field, and 4.2's catalog fixtures still parse; the memory stubs drive commitPaths, the verdict read and the dismissal in tests; the route-registry test lists every new route behind the gate, and every new route refuses with feature_off while Retrospectives is off and scripts_not_trusted without trust, and 10.6's guard-coverage test passes with each registered through bmadPieceRoutes; Workspace settings lets Retrospectives be turned on, and the dependency table test shows Retrospectives needing Board and not Unattended builds; the build-summary shape parses and carries no transcript field."
covers = ["E7-R1", "E7-R2", "E7-R3", "E7-R4", "E7-R5", "E7-R7"]
after = [1]
hitl = false
risk = "medium"
unknown = "Whether a dismissal kept per epic slug survives an epic being renamed; the draft assumes the slug, as tickets.py names it; and which message Save the lessons gives when AGENTS.md is absent or ignored by git."
references = [
  "packages/shared/src/bmad.ts",
  "packages/server/src/bmad-pieces.ts",
  "vendor/bmad-method/skills/bmad-retrospective/references/retro-document.md",
]

[[entry]]
