[[entry]]
id = 4
type = "story"
title = "Look back from the board: the action, the finished-epic offer and the verdict"
description = "Replaces the tracer's bare button with the designed epic header action Look back on this epic, taken from the catalog's epic-scoped action (catalog-memory until entry 3 lands) with the one-line not-accepted note on an epic with unfinished tickets, and completes the look-back's first message with entry 2's build summaries of the epic's runs (none when the epic has no runs); adds the offer Every ticket in this epic is done. Look back on it? with Look back and Not now (dismissal through entry 2's core use-case) when every ticket is done or dropped; completes the tickets-v7 adapter's read of each epic's retrospective frontmatter (verdict and date only) into entry 2's summary, refreshed when entry 4.8's watcher sees the file change, and shows it, through entry 2's refresh rule, as a verdict chip on the epic header, or a one-line notice when unreadable; shows the reduced-mode notice in place of the action on plain upstream BMad (4.11's notice); none of it with Retrospectives off."
verify = "Playwright against tickets-memory and catalog-memory shows the action and the offer only with Retrospectives on, Not now hiding the offer after a reload, the note on an unfinished epic, a look-back's first message carrying build summaries but no transcript text, and the reduced-mode notice when the look-back capability is missing; against the fixture repo, writing a retrospective file into an epic folder shows its verdict chip within seconds, a damaged frontmatter shows the notice, and nothing is read for the epic with Retrospectives off."
covers = ["E7-R2", "E7-R3", "E7-R4", "E7-R7", "E7-R1"]
after = [2]
hitl = false
risk = "medium"
unknown = "Whether 4.8's debounced rerun of tickets.py notices a retrospective file at all, which entry 2's refresh rule settles."
references = [
