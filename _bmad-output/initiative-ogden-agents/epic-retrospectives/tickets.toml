type = "story"
title = "Look-back and lessons actions in the BMAD fork"
description = "Adds to the bmad-method fork, on top of 4.5's label patch and in the metadata place 4.5 chose, an epic scope for bmad-retrospective (it takes an epic folder and belongs on the board's epic header, not in Plan home), its plain label Look back on this epic, and its two next steps in entry 2's shape (Add the lessons to AGENTS.md, which starts bmad-project-context on the retrospective file, and Turn the action items into tickets, which starts bmad-ticket on it), with labels from EXPERIENCE.md Voice and Tone, as one patch on the ogden-agents branch, tagged, re-vendored with forks.lock (pending: the user is reconsidering installing BMad from source instead of the bundled fork copy, 2026-10-02, which may change this entry's shape; revisit before it starts); and extends the bmad-catalog adapter to read the epic scope and the further next steps into entry 2's shape, to report the look-back capability that reduced mode gates on, and to build the catalog for a workspace with only Retrospectives on; entry 4 shows the epic-scoped action on the board and entry 5 renders the next steps on the document card; the hitl step is a person opening the upstream PR."
verify = "node scripts/vendor-forks.mjs --check passes with the new tag, the catalog adapter run against the vendored metadata lists the look-back action as epic-scoped with both next steps and the project-context label, and the upstream PR link is recorded in the build record."
