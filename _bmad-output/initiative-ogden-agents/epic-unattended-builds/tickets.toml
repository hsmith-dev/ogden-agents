[[entry]]
id = 8
type = "story"
title = "Dispatch, limits, Stop, Retry and Quit in core"
description = "Adds the core dispatcher behind entry 3's build request: one ticket, and all ready (which keeps dispatching newly ready tickets until none is left or the user stops it; its board button is 11.3), prerequisites read through TicketStorePort, the per-workspace and per-install limits with a queue (a queued ticket shows Queued on its card), editable in Workspace settings and Settings with defaults 2, 3 and 45 minutes (user decision 2026-10-01), a worktree from VcsPort and a sandbox from SandboxPort before each run, the maximum run time after which core stops the run and marks it blocked, Stop, Retry that marks the plan's resume status in the run's worktree through entry 5's TicketStorePort and redispatches there, verification in core before a run shows as ready for review (user decision 2026-10-01, so AD-17 holds from this epic's release): the plan status is built, an independent re-run of the project's tests in the run's worktree inside its sandbox passes (the test command from the project's AGENTS.md or BMad project context, else its package.json test script, else a failing No test command found check), and the diff against the base is not empty through VcsPort, setting the run verified or failed with each check's detail and emitting entry 3's verification event (11.2 adds richer reporting on top), the build session's header showing Stop while running and, when blocked, the plain reason and Retry (11.1 builds the full run view), turning builds or board off letting active runs finish while nothing new is dispatched, and Quit with runs active, or a crash or reboot, stopping them and marking them blocked with the reason interrupted, retried by hand (user decision 2026-10-01); every use-case is guarded by builds."
verify = "Against the fake runner and fixture repos, a request for all ready with three ready tickets runs two and queues one, a ticket with an unmet prerequisite is never dispatched, a changed limit takes effect for the next dispatch, a run past a shortened time limit is stopped and blocked, Retry on a blocked plan marks its resume status and the next run starts from it, Quit and a server restart mid-run each show it blocked as interrupted, turning builds off lets a running run finish and dispatches nothing more, a run that marks its plan built but whose fixture tests fail when re-run ends failed with 3 tests failed when re-run and is not ready for review, a run with an empty diff or a plan not built fails that check, a run passing all three ends verified, and every builds use-case returns feature_off with the piece off."
covers = ["E5-R2", "E5-R6", "E5-R7", "E5-R8", "E5-R9", "E5-R1"]
