[[entry]]
id = 8
type = "story"
title = "Dispatch, limits, retry and restarts in core"
description = "Adds the core dispatcher behind entry 3's build request: Build this story and Build all ready (which keeps dispatching newly ready tickets until none is left or the user stops it), prerequisites read through TicketStorePort, the per-workspace and per-install limits with a queue, a worktree from VcsPort and a sandbox from SandboxPort before each run, the maximum run time after which core stops the run and marks it blocked, Stop, Retry that marks the plan's resume status through tickets.py mark and redispatches in the same worktree, a verification hook entry 11 fills (stubbed as passing until then), turning builds or board off stopping active runs after one confirmation, Quit with runs active stopping them as stopped after one confirmation, and on server start every run whose process is gone becoming blocked with the reason interrupted; every use-case is guarded by builds."
verify = "Against the fake runner and fixture repos, Build all ready with three ready tickets runs two and queues one, a ticket with an unmet prerequisite is never dispatched, a run past a shortened time limit is stopped and blocked, Retry on a blocked plan marks its resume status and the next run starts from it, restarting the server mid-run shows it blocked as interrupted, and every builds use-case returns feature_off with the piece off."
covers = ["E5-R2", "E5-R7", "E5-R8", "E5-R1"]
after = [3]
hitl = false
risk = "high"
references = [
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-2--workspace-is-the-top-level-scope",
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-3--the-server-owns-agent-processes",
  "packages/server/src/app.ts",
]

