[[entry]]
id = 11
type = "story"
title = "Verification in core"
description = "Fills entry 8's verification hook: after a run ends built, core checks that the plan status is built, re-runs the project's tests in the worktree inside the run's sandbox (the test command from the project's AGENTS.md or BMad project context, else its package.json test script, else a failing No test command found check), and checks the diff against the base is not empty through VcsPort, then sets the run verified or failed with each check's detail; the UI shows a ticket as ready for review only when verified."
verify = "Against the fake runner, a run that marks its plan built but whose fixture tests fail when re-run ends failed with 3 tests failed when re-run, an empty diff fails its check, a run whose plan is not built fails its check, and a run passing all three ends verified."
covers = ["E5-R9"]
after = [8]
hitl = false
risk = "high"
unknown = "Where a project's test command is found reliably across stacks; the assumed order is recorded and the build record notes what the fixture and the scratch repo needed."
references = ["_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-17--unattended-runs-are-contained"]

[[entry]]
id = 12
type = "story"
title = "Review, approve and merge, reject and retry"
description = "Replaces the tracer's bare review page with the designed one at /w/:wsId/review/:ref: a plain summary, entry 11's three checks, the findings from the plan's Review Triage Log and deferred list, the diff behind Show the code changes (N files), and a sticky bar; Approve and merge, disabled until every check passes, is a core use-case that merges through VcsPort into the main checkout's branch without force, refuses a dirty main checkout, and only then marks the ticket done through TicketStorePort.mark, the only path to done; a conflict blocks the run as needing a rebase with Update and retry (rebase in the worktree, then rerun); Reject and retry sends an optional note and redispatches through entry 8."
verify = "Against fixture repos, approving a verified run merges its branch and the plan reads done, approving a failed run is refused with checks_failed and changes nothing, a conflicting merge blocks the run with its sentence and leaves the main checkout unchanged, Update and retry rebases and reruns, Reject and retry redispatches with the note in the first message, and a search of the code finds no other caller that marks done."
covers = ["E5-R10"]
after = [5, 11]
hitl = false
risk = "high"
references = [
  "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#key-flows",
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-10--ticket-state-lives-only-in-the-bmad-files-adopted",
]

