# Epic 5 breakdown. DRAFT from autonomous inception (2026-10-01), not yet approved by the user. Table order is the build order; ids never change once approved.
# Epic 5 starts after epic 4's refactor sweep (4.12) and epic 10's BMad pieces contract (10.2); the spike (1) needs only the bundled bmad-loop wheel (1.9) and may run earlier. References to other epics use "<epic id>.<entry id>".
# Live checks use the developer's existing Claude Code login or an API key saved through 9.2, in a scratch repo, never Ogden Agents's own repo.

[[entry]]
id = 1
type = "spike"
title = "Probe the build driver and OS behaviour in CI"
description = "In a temporary CI job on macos-latest, ubuntu-latest and windows-latest, runs the bundled bmad-loop wheel through uv with its mock adapter to learn whether it can run one named v7 ticket headless in a worktree Ogden created under a data-folder path, with its run folder outside the repo, without tmux or psmux installed by the user, what structured events it emits (journal, events, the agent transcript), and whether its process tree stops cleanly (taskkill /T on Windows); also measures git worktree add and remove at a deep data-folder path on Windows (MAX_PATH, core.longpaths), and which sandboxes the runners have (Seatbelt, bubblewrap, Docker with Linux containers); records the facts with run ids and a recommended driver (bmad-loop or an ACP build session) in the build record, lists the fork patches entry 4 needs, and removes the probe job before review; the hitl step is the user confirming the driver."
verify = "The build record holds the CI run ids for all three OSes, a yes or no with evidence for each question above, the list of bmad-loop patches entry 4 must carry, and the user's recorded driver decision; no probe job remains in the workflows."
covers = ["E5-R5", "E5-R12", "E5-R3", "E5-R4"]
after = ["1.9"]
hitl = true
risk = "high"
unknown = "Whether bmad-loop can run without a multiplexer at all, and whether its Windows process host (psmux) can be bundled or avoided; the answer decides the driver."
references = [
  "vendor/bmad-loop/bmad_loop-0.13.0-py3-none-any.whl",
  "_bmad-output/initiative-ogden-agents/epic-terminal-toggle/epic-terminal-toggle-retrospective.md",
  "_bmad-output/initiative-ogden-agents/spec-ogden-agents/agent-matrix.md",
]

[[entry]]
id = 2
type = "story"
title = "Tracer bullet: one ticket built, reviewed and approved from a bare page"
description = "Adds a bare Build button on the board card shown only with the builds piece on, a core use-case guarded by requireBmadFeature(builds) that creates a build session and its run, a minimal vcs-git adapter that adds a worktree on its own branch under the data folder, a minimal native-sandbox adapter for Claude Code on macOS or Linux (refusing elsewhere), a minimal buildrunner-bmad-loop adapter driving the bundled fork as entry 1 decided to run bmad-build-auto for that one ticket, its activity as session.* events in the read-only session view, the run outcome from the plan status, and a bare review page with the diff and an Approve that merges locally and marks the ticket done through TicketStorePort.mark; routes through bmadPieceRoutes; the hitl step is the developer's live run in a scratch repo with Planning, Board and Unattended builds turned on."
verify = "Live on the developer's machine, Build on one ready ticket in the scratch repo creates a worktree outside the repo, streams Claude Code's work into the session view, ends built, and Approve merges the branch and the board shows the ticket Done; in CI against the fake runner and a fixture repo, the same path runs end to end and the dispatch route returns feature_off with the builds piece off."
covers = ["E5-R1", "E5-R2", "E5-R3", "E5-R4", "E5-R5", "E5-R6", "E5-R10"]
after = [1, "4.12", "10.2"]
hitl = true
risk = "high"
unknown = "Whether the vendored bmad-loop runs one named ticket as entry 1 found without entry 4's patch; if it cannot, the tracer drives bmad-loop's lowest-level one-unit run, and the build record says what entry 4 must replace."
references = [
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-17--unattended-runs-are-contained",
  "_bmad-output/initiative-ogden-agents/spec-ogden-agents/bmad-integration.md",
]

[[entry]]
id = 3
type = "story"
title = "Epic contracts and stubs"
description = "Freezes in shared the run shape additions (branch, base revision, sandbox kind, blocked code and reason, queue position), the build request (one ticket or all ready) and its error codes (sandbox_unavailable, prerequisite_unmet, not_ready, run_active, merge_conflict, checkout_dirty, checks_failed; feature_off is 10.2's), the run.* and verification events, the halt-code table mapping each bmad-build-auto halt to a code and its plain sentence from EXPERIENCE.md, the verification result (three checks, each pass or fail with detail), the review payload (summary, checks, findings, diff stats), approve, reject and retry requests, the notification settings and webhook payload, and the default limits (2 per workspace, 3 per install, 45 minutes); completes BuildRunnerPort, VcsPort, SandboxPort and NotifierPort with build-memory, vcs-memory, sandbox-memory and notify-memory stubs and a fake bmad-loop and fixture repo; appends builds to SHIPPED_BMAD_PIECES; and pre-registers every new route through bmadPieceRoutes and every adapter wiring slot, so the fork, worktree, sandbox, runner, dispatcher, verification, review and notification lanes open at once. Every shared shape, including user-facing reasons, lives in shared (epic 3 retro A2); it is a reviewed story with lenses_ran recorded (L1) and owns the epic's fakes and fixtures (the fake bmad-loop, a fixture repo with a ready ticket and one with an unmet prerequisite, a fake test command that can be made to fail), which behave like the real program in process count, stdin mode and timing (A9, L3)."
verify = "Contract tests parse every new shape, request, error code and event and cover every halt code with its sentence; the memory stubs drive every port method in a test; GET /api/v1/bmad/pieces shows builds available; the route-registry test in gate.test.ts lists every new route behind the gate under /api/v1/workspaces/:wsId and 10.6's guard-coverage test passes."
covers = ["E5-R1", "E5-R2", "E5-R3", "E5-R4", "E5-R5", "E5-R6", "E5-R7", "E5-R9", "E5-R10", "E5-R11"]
after = [2]
hitl = false
risk = "medium"
unknown = "Whether bmad-loop's halt codes match the bmad-integration.md list exactly; the table is built from what the fork emits and the spike recorded."
references = [
  "packages/shared/src/entities.ts",
  "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#voice-and-tone",
]

[[entry]]
id = 4
type = "story"
title = "bmad-loop fork patches for one named ticket"
description = "Adds to the bmad-loop fork, as one patch per upstream PR on its ogden-agents branch, what entry 1 found missing for running one named v7 ticket headless with bmad-build-auto in a worktree the caller created, with its run folder in a caller-given path outside the repo, a machine-readable event stream entry 7 maps to session.* events, and no multiplexer the user installs; tags the fork, re-vendors the wheel and updates forks.lock; the hitl step is a person opening the upstream PRs."
verify = "node scripts/vendor-forks.mjs --check passes with the new tag, the fork's own tests pass, a run of the vendored wheel with its mock adapter against a fixture repo runs one named ticket in a given worktree and writes nothing under the repo, and the upstream PR links are recorded in the build record."
covers = ["E5-R5", "E5-R3"]
after = [1]
hitl = true
risk = "high"
unknown = "Whether upstream accepts an external run folder and a headless one-ticket mode; until it does the patches stay carried (AD-13)."
references = [
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-13--forks-are-bundled-and-locked-adopted",
  "forks.lock",
]

[[entry]]
id = 5
type = "story"
title = "Worktrees in the data folder"
description = "Completes the vcs-git adapter behind entry 3's VcsPort: adds a worktree per run under the data folder on a branch named from the ticket (ogden/<ref>-<slug>) from the main checkout's current branch, refuses a dirty or detached main checkout with a plain reason, keeps paths within Windows' limits (short run folder names, core.longpaths where needed), reports the diff and its stats against the base, merges a branch into the main checkout without force and reports a conflict with the checkout left unchanged, rebases a branch in its worktree, applies a saved patch, and removes a worktree and its branch after a merge or a discard; adds TicketStorePort's read of an active run's plan from its worktree (AD-10) without the watcher ever scanning it."
verify = "On all three OSes in CI against fixture repos, two worktrees for two tickets are created outside the repo with no shared files, a deep data-folder path works on Windows, the diff stats match git, a clean merge lands, a conflicting merge reports merge_conflict and leaves the main checkout byte-for-byte unchanged, removal leaves no worktree or branch behind, and a plan written in a worktree is what TicketStorePort returns for that ticket while its run is active."
covers = ["E5-R3", "E5-R10"]
after = [3]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-10--ticket-state-lives-only-in-the-bmad-files-adopted"]

[[entry]]
id = 6
type = "story"
title = "The sandbox chain and the Build dialog"
description = "Completes SandboxPort with sandbox-claude-native (Claude Code's own sandbox settings, Seatbelt on macOS, bubblewrap on Linux and WSL2, the worktree and the paths entry 1 recorded as the only writable ones) and sandbox-docker (only when Docker is already installed and running), tried in that order, returning sandbox_unavailable with the three choices otherwise; adds the Build dialog component (Use another agent, shown disabled until epic 6, Install Docker, Build with me watching) that entry 10 places on the board; Build with me watching starts an attended build session whose every tool call goes through permission cards at the ask caution level; records in deferred-work.md that the 2.6 check-then-use item is closed by the sandbox enforcing paths."
verify = "Against a fake Claude Code in CI, on macOS and Linux a sandboxed run cannot write outside its worktree, on windows-latest with no usable Docker the build is refused with sandbox_unavailable and Playwright shows the dialog's three choices, Build with me watching raises a permission card for the first command, and no path starts an unattended run without a sandbox."
covers = ["E5-R4", "E5-R12"]
after = [3]
hitl = false
risk = "high"
unknown = "Exactly what Claude Code's sandbox must leave writable for git in a worktree and for a subscription login, and whether Docker's Linux containers on Windows see the worktree path; entry 1 measures, this entry records."
references = [
  "_bmad-output/initiative-ogden-agents/spec-ogden-agents/agent-matrix.md",
  "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#state-patterns",
]

[[entry]]
id = 7
type = "story"
title = "The bmad-loop build runner"
description = "Completes the buildrunner-bmad-loop adapter behind entry 3's BuildRunnerPort on entry 4's re-vendored fork: runs bmad-build-auto through bmad-loop via uv for one named ticket in a given worktree and sandbox with Claude Code, with an allowlisted environment that carries an API key from the keychain only in the child's environment (AD-16), maps bmad-loop's event stream to the same session.* events a chat emits, reads the result from the plan (built, blocked with blocked_at and blocked_reason, intent-gap patch path), maps halts to entry 3's codes, and stops the whole process tree with killProcessTree; names bmad-build-auto only inside this adapter (AD-12)."
verify = "Against fixture repos and the vendored wheel with its mock adapter in CI on all three OSes, a run streams session.* events that the session view renders, ends with the plan's status, a halting run reports its code and reason, Stop leaves no process behind, and no secret appears in any event or log line."
covers = ["E5-R5", "E5-R6", "E5-R7", "E5-R12"]
after = [3, 4]
hitl = false
risk = "high"
references = [
  "_bmad-output/initiative-ogden-agents/spec-ogden-agents/bmad-integration.md",
