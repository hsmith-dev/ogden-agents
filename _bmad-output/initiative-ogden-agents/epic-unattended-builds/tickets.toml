[[entry]]
id = 4
type = "story"
title = "Headless build session over ACP for one named ticket"
description = "Adds to the Claude Code ACP adapter a headless build session (user decision 2026-10-02: no bmad-loop, the ACP fallback): an Ogden-managed ACP session started with the run's worktree as its working folder, in the sandbox entry 6 gives it, whose one prompt runs bmad-build-auto for one named ticket (ticket <ref>), with no composer, no tmux or psmux, and the agent as a direct child of the server so killProcessTree stops it; writes the session's structured activity as NDJSON in the run's folder in Ogden's data folder (never in the repo), and when the session ends writes a per-run JSON result there (status read from the plan, commit, base revision, blocked code and reason, intent-gap patch path), the two bmad-integration.md Fork extensions this entry owns, now built on Ogden's side; and checkpoint pauses: when the ticket has plan_checkpoint or done_checkpoint and the skill stops there, the session reports a pause in the event stream and resumes on request in the same session, or in a new one from the plan's status when the old one is gone. Permission requests in a sandboxed run follow entry 6's rules; an attended run puts each through a permission card. The seven bmad-loop patches spike 5.1 listed stay a v2 or upstream note (epic Notes), not this entry."
verify = "Against a fake ACP build agent and entry 3's fixture repo in CI on all three OSes, a headless session runs one named ticket in a given worktree and writes nothing under the repo, its NDJSON activity and per-run JSON result land in the run's folder in the data folder, the result's status matches the plan, a fixture ticket with plan_checkpoint pauses and resumes on request (and from the plan's status after a server restart), and killProcessTree on the session leaves no process behind."
