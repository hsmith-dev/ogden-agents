type = "story"
title = "Tracer bullet: one ticket built, reviewed and approved from a bare page"
description = "Adds a bare Build button on the board card shown only with the builds piece on, a core use-case guarded by 10.2's requireBmadFeature(builds) that creates a build session and its run, a minimal vcs-git adapter that adds a worktree on its own branch under the data folder, a minimal native-sandbox adapter for Claude Code on macOS or Linux (refusing elsewhere), a minimal buildrunner-acp adapter that starts an Ogden-managed Claude Code ACP session in that worktree (epic 4's planning-session pattern) and sends bmad-build-auto for that one ticket (ticket <ref>), no tmux, psmux or bmad-loop (user decision 2026-10-02, after entry 1), its activity as session.* events in the read-only session view, the run outcome from the plan status, and a bare review page with the diff and an Approve that merges locally and marks the ticket done through TicketStorePort.mark; routes go through 10.2's piece route helper; the hitl step is the developer's live run in a scratch repo with Planning, Board and Unattended builds turned on."
verify = "Live on the developer's machine, Build on one ready ticket in the scratch repo creates a worktree outside the repo, streams Claude Code's work into the session view, ends built, and Approve merges the branch and the board shows the ticket Done; in CI against the fake runner and a fixture repo, the same path runs end to end and the dispatch route returns feature_off with the builds piece off."
covers = ["E5-R1", "E5-R2", "E5-R3", "E5-R4", "E5-R5", "E5-R6", "E5-R9"]
after = [1, "4.12", "10.2"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
unknown = "Whether bmad-build-auto accepts the ogden/<ref>-<slug> branch (an LLM judgement entry 1 could not measure without a real agent), and how its plan_checkpoint stop shows over ACP; the build record says what entry 4 must add."
references = [
