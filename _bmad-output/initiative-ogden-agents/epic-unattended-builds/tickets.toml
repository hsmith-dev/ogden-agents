[[entry]]
id = 5
type = "story"
title = "Worktrees in the data folder"
description = "Completes the vcs-git adapter behind entry 3's VcsPort: adds a worktree per run under the data folder on a branch named from the ticket (ogden/<ref>-<slug>, as the tracer (2) confirms bmad-build-auto accepts) from the main checkout's current branch, refuses a dirty or detached main checkout with a plain reason, offers a dirty check that ignores uncommitted changes under the BMad output folder (_bmad-output) for entry 9's approve (user decision 2026-10-01), keeps paths within Windows' limits (a short layout such as <data>/w/<8-char id> and -c core.longpaths=true on every git call, as spike 5.1 measured), reports the diff and its stats against the base, merges a branch into the main checkout locally without force and never pushes, leaving the merge uncommitted when asked so entry 9 can add the done mark to the merge commit, reports a conflict with the checkout left unchanged, rebases a branch in its worktree, applies a saved patch (for 11.1's Apply the saved fix and retry), and removes a worktree and its branch after a merge or a discard; makes TicketStorePort read and mark an active run's plan in its worktree (AD-10), finding active runs and their worktree path through the Run entity, without the watcher ever scanning worktrees."
verify = "On all three OSes in CI against fixture repos, two worktrees for two tickets are created outside the repo with no shared files, a deep data-folder path works on Windows, the diff stats match git, a clean merge lands, a merge left uncommitted takes an added file into its merge commit, the approve dirty check ignores a change under _bmad-output and reports one elsewhere, a conflicting merge reports merge_conflict and leaves the main checkout byte-for-byte unchanged, removal leaves no worktree or branch behind, and a plan written or marked in a worktree is what TicketStorePort returns for that ticket while its run is active."
covers = ["E5-R3", "E5-R9"]
after = [3]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-10--ticket-state-lives-only-in-the-bmad-files-adopted"]

