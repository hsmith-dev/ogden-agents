# Epic 5 (5a) breakdown (approved by the user 2026-10-01, split in two; drafted by autonomous inception). Table order is the build order; ids never change once approved.
# Epic 5 starts after epic 4's refactor sweep (4.12) and epic 10's BMad pieces contract (10.2); the spike (1) needs only the bundled bmad-loop wheel (1.9) and may run earlier. Epic 11 (5b) follows it. References to other epics use "<epic id>.<entry id>".
# Live checks use the developer's existing Claude Code login or an API key saved through 9.2, in a scratch repo, never Ogden Agents's own repo.

[[entry]]
id = 1
type = "spike"
title = "Probe the build driver and OS behaviour in CI"
description = "In a temporary CI job on macos-latest, ubuntu-latest and windows-latest, runs the bundled bmad-loop wheel through uv with its mock adapter to confirm the user's chosen driver (bmad-loop, user decision 2026-10-01): whether it runs one named v7 ticket headless in a worktree Ogden created under a data-folder path, with its run folder in the data folder, without tmux or psmux installed by the user, what structured events it emits (journal, events, the agent transcript), whether its process tree stops cleanly (taskkill /T on Windows), and whether bmad-build-auto accepts the planned ogden/<ref>-<slug> branch or halts as a mismatched branch; also measures git worktree add and remove at a deep data-folder path on Windows (MAX_PATH, core.longpaths), and which sandboxes the runners have (Seatbelt, bubblewrap, Docker with Linux containers); records the facts with run ids in the build record and lists the fork patches entry 4 needs; if bmad-loop fails on any OS, records the ACP build-session fallback; removes the probe job before review; the hitl step is the user confirming the result."
verify = "The build record holds the CI run ids for all three OSes, a yes or no with evidence for each question above, the list of bmad-loop patches entry 4 must carry, and the user's confirmation of the driver; if the fallback was taken, the AD-5, AD-12 and spec deltas it needs are applied to the spine and spec before entry 2 starts; no probe job remains in the workflows."
covers = ["E5-R5", "E5-R10", "E5-R3", "E5-R4"]
after = ["1.9"]
hitl = true
risk = "high"
unknown = "Whether bmad-loop can run without a multiplexer at all, and whether its Windows process host (psmux) can be bundled or avoided; a no on any OS takes the ACP build-session fallback."
references = [
  "vendor/bmad-loop/bmad_loop-0.13.0-py3-none-any.whl",
  "_bmad-output/initiative-ogden-agents/epic-terminal-toggle/epic-terminal-toggle-retrospective.md",
  "_bmad-output/initiative-ogden-agents/spec-ogden-agents/agent-matrix.md",
]

[[entry]]
id = 2
type = "story"
title = "Tracer bullet: one ticket built, reviewed and approved from a bare page"
description = "Adds a bare Build button on the board card shown only with the builds piece on, a core use-case guarded by 10.2's requireBmadFeature(builds) that creates a build session and its run, a minimal vcs-git adapter that adds a worktree on its own branch under the data folder, a minimal native-sandbox adapter for Claude Code on macOS or Linux (refusing elsewhere), a minimal buildrunner-bmad-loop adapter driving the bundled fork as entry 1 confirmed to run bmad-build-auto for that one ticket, its activity as session.* events in the read-only session view, the run outcome from the plan status, and a bare review page with the diff and an Approve that merges locally and marks the ticket done through TicketStorePort.mark; routes go through 10.2's piece route helper; the hitl step is the developer's live run in a scratch repo with Planning, Board and Unattended builds turned on."
verify = "Live on the developer's machine, Build on one ready ticket in the scratch repo creates a worktree outside the repo, streams Claude Code's work into the session view, ends built, and Approve merges the branch and the board shows the ticket Done; in CI against the fake runner and a fixture repo, the same path runs end to end and the dispatch route returns feature_off with the builds piece off."
covers = ["E5-R1", "E5-R2", "E5-R3", "E5-R4", "E5-R5", "E5-R6", "E5-R9"]
after = [1, "4.12", "10.2"]
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
unknown = "Whether the vendored bmad-loop runs one named ticket as entry 1 found without entry 4's patch; if it cannot, the tracer drives bmad-loop's lowest-level one-unit run, and the build record says what entry 4 must replace."
references = [
  "_bmad-output/initiative-ogden-agents/architecture-ogden-agents/architecture-ogden-agents.md#ad-17--unattended-runs-are-contained",
  "_bmad-output/initiative-ogden-agents/spec-ogden-agents/bmad-integration.md",
]

[[entry]]
id = 3
type = "story"
title = "Contracts and stubs for epics 5 and 11"
description = "Freezes in shared, for this epic and epic 11, the run shape additions (agent, Claude Code the only accepted value in v1, so epic 6 adds adapters only; branch, base revision, worktree path, sandbox kind, blocked code and reason, queue position), the build request (agent and one ticket or all ready) and its error codes (sandbox_unavailable, prerequisite_unmet, not_ready, run_active, merge_conflict, checkout_dirty, checks_failed; feature_off is 10.2's), the run.* and verification events, Ogden's blocked codes and their plain sentences from EXPERIENCE.md (the mapping from bmad-build-auto halts to these codes lives only in entry 7's adapter, AD-12), the verification result (three checks, each pass, fail or not run, with detail; entry 8 runs all three, user decision 2026-10-01) and the per-workspace test-command override and check-again request 11.2 uses, the review payload (summary, checks, findings, diff stats), approve, reject and retry requests, the run limits and their settings (defaults 2 per workspace, 3 per install, 45 minutes, user decision 2026-10-01), the app-wide notification settings and webhook payload; completes BuildRunnerPort, VcsPort and SandboxPort and defines NotifierPort, with build-memory, vcs-memory, sandbox-memory and notify-memory stubs and a fake bmad-loop; registers builds as available the way 10.2 defines; and pre-registers every new route of both epics through 10.2's piece route helper and every adapter wiring slot, so the fork, worktree, sandbox, runner and dispatcher lanes here and epic 11's lanes open at once. Every shared shape, including user-facing reasons, lives in shared (epic 3 retro A2); it is a reviewed story with lenses_ran recorded (L1) and owns both epics' fakes and fixtures (the fake bmad-loop, a fixture repo with a ready ticket and one with an unmet prerequisite, a fake test command that can be made to fail, used by entry 8's re-run), which behave like the real program in process count, stdin mode and timing (A9, L3)."
verify = "Contract tests parse every new shape, request, error code and event and cover every blocked code with its sentence; the memory stubs drive every port method in a test; the available-pieces response shows builds available; the route-registry test in gate.test.ts lists every new route behind the gate under /api/v1/workspaces/:wsId (the notification settings under the install scope) and 10.6's architecture test passes."
covers = ["E5-R1", "E5-R2", "E5-R3", "E5-R4", "E5-R5", "E5-R6", "E5-R7", "E5-R9"]
after = [2, "10.6"]
hitl = false
risk = "medium"
unknown = "Whether bmad-loop's halts all map onto the blocked codes in bmad-integration.md; the codes are built from what the fork emits and the spike recorded."
references = [
  "packages/shared/src/entities.ts",
  "_bmad-output/initiative-ogden-agents/ux-ogden-agents/EXPERIENCE.md#voice-and-tone",
]

