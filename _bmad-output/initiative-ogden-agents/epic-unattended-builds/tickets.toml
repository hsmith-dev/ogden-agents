title = "The sandbox chain and the Build dialog"
description = "Completes SandboxPort with sandbox-claude-native (Claude Code's own sandbox settings, Seatbelt on macOS, bubblewrap on Linux and WSL2, the worktree and the paths entry 1 recorded as the only writable ones, with subagents available inside it as bmad-build-auto needs) and sandbox-docker (only when Docker is already installed and running), tried in that order, returning sandbox_unavailable with the three choices otherwise; adds the Build dialog component (Use another agent, shown disabled until epic 6, Install Docker, Build with me watching) and opens it from the tracer's Build button (11.3 opens it from the designed Build actions); this entry owns the card's Build button until 11.3, and entry 8 adds Queued beside it; on Windows, Build defaults to Build with me watching, and Docker Desktop is offered as optional (user decision 2026-10-01); Build with me watching starts an attended build session whose every tool call goes through permission cards at the ask caution level; records in deferred-work.md that the 2.6 check-then-use item is closed by the sandbox enforcing paths."
verify = "Against a fake Claude Code in CI, on macOS and Linux a sandboxed run cannot write outside its worktree; on windows-latest with no usable Docker, SandboxPort returns sandbox_unavailable and a component test shows the dialog's three choices with Build with me watching first; Build with me watching raises a permission card for the first command; and no path starts an unattended run without a sandbox."
