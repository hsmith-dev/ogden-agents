[[entry]]
id = 3
type = "story"
title = "Contracts and stubs for epics 5 and 11"
description = "Freezes in shared, for this epic and epic 11, the run shape additions (agent, Claude Code the only accepted value in v1, so epic 6 adds adapters only; branch, base revision, worktree path, sandbox kind, blocked code and reason, queue position), the build request (agent and one ticket or all ready) and its error codes (sandbox_unavailable, prerequisite_unmet, not_ready, run_active, merge_conflict, checkout_dirty, checks_failed; feature_off is 10.2's), the run.* and verification events, Ogden's blocked codes and their plain sentences from EXPERIENCE.md (the mapping from bmad-build-auto halts to these codes lives only in entry 7's adapter, AD-12), the verification result (three checks, each pass, fail or not run, with detail; entry 8 runs all three, user decision 2026-10-01) and the per-workspace test-command override and check-again request 11.2 uses, the review payload (summary, checks, findings, diff stats), approve, reject and retry requests, the run limits and their settings (defaults 2 per workspace, 3 per install, 45 minutes, user decision 2026-10-01), the app-wide notification settings and webhook payload; completes BuildRunnerPort, VcsPort and SandboxPort and defines NotifierPort, with build-memory, vcs-memory, sandbox-memory and notify-memory stubs and a fake ACP build agent; registers builds by appending to SHIPPED_BMAD_PIECES and serves every build route, the /ws run stream included, through bmadPieceRoutes (epic 10 retro A8, approved 2026-10-02); and pre-registers every new route of both epics and every adapter wiring slot, so the headless session, worktree, sandbox, runner and dispatcher lanes here and epic 11's lanes open at once. Every shared shape, including user-facing reasons, lives in shared (epic 3 retro A2); it is a reviewed story with lenses_ran recorded (L1) and owns both epics' fakes and fixtures (the fake ACP build agent, a fixture repo with a ready ticket and one with an unmet prerequisite, a fake test command that can be made to fail, used by entry 8's re-run), which behave like the real program in process count, stdin mode and timing (A9, L3)."
verify = "Contract tests parse every new shape, request, error code and event and cover every blocked code with its sentence; the memory stubs drive every port method in a test; the available-pieces response shows builds available; the route-registry test in gate.test.ts lists every new route behind the gate under /api/v1/workspaces/:wsId (the notification settings under the install scope), 10.6's architecture test and guard-coverage test pass with no new allow-list entry, and the installed suite's remaining Coming soon check names only Retrospectives."
