# Epic 12 breakdown. Table order is the build order; ids never change once written.
# Entries 1 and 2 (the spikes) were written 2026-10-02 and are built; they cover the spec capabilities directly because the epic's Requirements did not exist yet.
# Entries 3 to 11 are the full inception, drafted autonomously 2026-10-04 after epic 6's groundwork (6.2, 6.3, 6.4, 6.6) was built, and approved by the user 2026-10-04 (answers in the epic's Notes, Approval).
# Lanes after 4: Codex (5, 6) and Grok (7, 8) run in parallel and touch only their own adapter folders; 3 and 4 own every shared file first.
# A no-go agent (its spike's live checks fail, or for Grok the user's terms read) drops its two entries; the other lane is unaffected, and 9 to 11 cover the go agents only.
# References to other epics use "<epic id>.<entry id>".
# Each spike ends with the user's go or no-go for that agent. A no-go agent moves back to epic 8 (v2); the other agent is unaffected.
# Neither spike signs in or uses a secret; live checks with the developer's own account come after, in a scratch repo, never Ogden Agents's own repo.

[[entry]]
id = 1
type = "spike"
title = "Can Ogden drive Codex over ACP on all three OSes?"
description = "Adds a temporary CI job on Windows, Linux and macOS that installs the registry's pinned codex-acp adapter (with the Codex CLI it bundles) into a temp data folder with npm ci from a pinned lock, checks its integrity, starts it over stdio with an allowlisted environment and an empty home, and records: initialize's capabilities and auth methods, session/new without auth, list, load and resume, the session modes and how they map to Ask, Auto and Skip all, the permission option kinds it sends (from its source), terminal and MCP support, which skill folders it reads, startup time, install size, stopping the process tree, and Windows behaviour including the sandbox; it also re-checks OpenAI's terms on third-party clients; the hitl step is the user reading the results and deciding go or no-go."
verify = "The probe's logs on all three OSes answer each question, the findings and a go or no-go recommendation are written into the plan with proposed agent-matrix.md rows, the terms re-check is recorded, the user's live checks are listed, the user's go or no-go is recorded as a dated Decision in the epic's Notes, and the temporary job is removed."
covers = ["CAP-15", "CAP-3", "CAP-5", "CAP-16"]
after = []
hitl = true
risk = "high"
unknown = "Whether ChatGPT sign-in finishes without a terminal on every OS, whether Codex's Windows sandbox is still experimental, and whether OpenAI's terms allow a third-party local UI to use a ChatGPT subscription."
references = ["https://github.com/agentclientprotocol/registry/blob/main/codex-acp/agent.json", "https://github.com/agentclientprotocol/codex-acp", "https://developers.openai.com/codex/windows"]

