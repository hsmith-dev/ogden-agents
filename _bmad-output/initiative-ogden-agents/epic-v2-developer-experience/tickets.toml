# Epic 8 breakdown (v1.3, the Workbench). Table order is the build order; ids never change once written.
# Drafted autonomously 2026-10-31 from change-desktop-ux-uplift section 4.4 (approved by the user 2026-10-31, with AD-36 to AD-39 adopted). References to other epics use "<epic id>.<entry id>".
# CI never uses a real agent, model, phone or network: fakes on loopback only. Live checks with real CLIs, agents, editors and devices are hitl.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: the Files tab lists the project and shows one file read-only through WorkspaceFilesPort"
description = "Adds the thinnest path: `WorkspaceFilesPort` with list and read, a `workspace-files-node` adapter that resolves each path and refuses anything outside the project's top folder, `.git` internals and credential folders, two GET routes under the AD-15 gate taking a workspace id and a relative path, and a Workbench tab with a Files tree that opens one file in a read-only viewer."
verify = "On all three OSes a test lists a fixture project and opens one file through the real server, and a `../` path, an absolute path, a link out of the project, `.git` internals and a credential folder are refused."
covers = ["E8-R1", "E8-R2"]
after = ["2.5"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Epic contracts and stubs: files, search, diff views, hunk actions, project commands, editor launcher; routes and events"
description = "Adds the shared schemas and memory stubs for the full `WorkspaceFilesPort` (search, caps, binary, masking), the `VcsPort` diff views, turn snapshots and hunk operations, the project-command use-cases and run events (ids, state, exit code, counts only), `EditorLauncherPort`, the chat `worktreePath` and branch fields with their events (moved from 25.2; 27.3 creates worktree chats on them), every route under the AD-15 gate off AD-34's device allowlist and taking a worktree chat's session id to root it at its `worktreePath` (AD-36; 8.4 and 27.3 rely on this), and the palette-derived syntax colour tokens entries 3 and 7 share, with architecture tests that no route takes an absolute path and no UI or use case runs git, so the lanes start at once."
verify = "Unit and architecture tests pass, including that no event schema carries file content, command output or a diff."
covers = ["E8-R1", "E8-R4", "E8-R5", "E8-R8", "E8-R9"]
after = [1]
hitl = false
risk = "medium"
unknown = "The exact search-result and command-output caps beyond the 1 MB read default (architecture open items: decided in epic 8); entry 2 proposes them and records a Decision line, and entries 8 and 9 use them."

[[entry]]
id = 3
type = "story"
title = "The diff viewer component, used by Review first"
description = "Builds the one diff viewer from DESIGN.md (per-file sections, a file jump, syntax colour from entry 2's palette-derived tokens checked at 4.5:1 in both themes, inline or side by side, no sideways page scroll) with slots for the hunk actions and line comments entries 5 and 6 add, and replaces Review's raw `git diff` text and the chat's per-edit hunks with it."
verify = "Playwright opens a fixture run's Review and a chat edit row and sees per-file sections in both layouts; a contrast test passes for every syntax token in light and dark."
covers = ["E8-R3"]
after = [2, "5.9"]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-ogden-agents/research-desktop-agent-ux/screens/10b-review-diff-open.png"]

[[entry]]
id = 4
type = "story"
title = "Changes panel: This turn, Unstaged, Staged and Branch; turn snapshots; Commit these changes for a worktree chat"
description = "Records a tree snapshot at each turn's start and end in the data directory (no commit, no ref), builds the Changes panel on entry 3's viewer with the four views through `VcsPort`, and, for a chat with a `worktreePath` (entry 2's field), the user-clicked local commit to its branch with hooks off, serialized with the repo's git work, never pushed, with the plain line about merging (moved from 25.7); 27.3 relies on this commit for its worktree chats."
verify = "Tests show only one turn's edits under This turn after two fake-agent turns, and commit a fixture chat worktree's changes to its branch only, with hooks off and the main checkout unchanged."
