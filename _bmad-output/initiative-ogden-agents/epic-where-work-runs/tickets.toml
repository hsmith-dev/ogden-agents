[[entry]]
id = 10
type = "story"
title = "End-to-end suite and v1.3 release part; live checks with real agents and a remote machine"
description = "Adds the epic's end-to-end journey on all three OSes with fakes only (a worktree chat from the composer, hand-off, a two-agent trial kept and restored) in the desktop app and on the npm route, updates docs, and lists the user's live checks: a real agent in a worktree chat, a trial with two real agents, and a chat on a real remote machine."
verify = "The end-to-end suite passes in CI on macOS, Windows and Linux, and the user's live check results are recorded in the plan."
