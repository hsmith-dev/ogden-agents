# Ogden Agents epics, in build order. `after` names what each epic needs and from which epic.

[[epic]]
id = 1
slug = "epic-foundation-and-forks"
title = "Ogden Agents installs, opens and stays up to date on every OS"
covers = ["CAP-1"]

[[epic]]
id = 2
slug = "epic-chat-and-workspaces"
title = "Chat with your own agent in workspaces across projects"
covers = ["CAP-3", "CAP-4", "CAP-17"]
after = [{ epic = 1, needs = "the server, security gate, event log, entity model and design system" }]

[[epic]]
id = 9
slug = "epic-first-run-onboarding"
title = "New users install and sign into their own agent from the browser"
covers = ["CAP-16"]
after = [{ epic = 2, needs = "contracts and stubs (2.3), the tracer's Claude Code adapter (2.2), the app shortcut (2.4), workspaces (2.5) and the session view (2.10)" }]

[[epic]]
id = 3
slug = "epic-terminal-toggle"
title = "Advanced users switch a chat to the agent's own terminal and back"
covers = ["CAP-5"]
after = [{ epic = 2, needs = "persistent sessions and the session view" }]

[[epic]]
id = 10
slug = "epic-bmad-optional-per-project"
title = "Projects start as simple multi-agent chats, and each turns on the BMad pieces it wants"
covers = ["CAP-19", "CAP-17"]
after = [{ epic = 2, needs = "workspace settings, the caution-level pattern and workspace.settings_changed (2.5, 2.8)" }, { epic = 9, needs = "Welcome's project step (9.5)" }, { epic = 3, needs = "its refactor sweep (3.9) and its suite and release (3.10) first" }]

[[epic]]
id = 4
slug = "epic-planning-and-board"
title = "Plan with every BMAD skill and track it on a live board"
covers = ["CAP-2", "CAP-6", "CAP-7", "CAP-18"]
after = [{ epic = 1, needs = "the bundled forks and forks.lock" }, { epic = 2, needs = "chat sessions, which planning runs in" }, { epic = 10, needs = "the per-project BMad pieces contract, guard, route helper and BmadCatalogPort.detect (10.2)" }]

[[epic]]
id = 5
slug = "epic-unattended-builds"
title = "One ticket builds safely, and you approve and merge it"
covers = ["CAP-8", "CAP-9", "CAP-12"]
after = [{ epic = 1, needs = "the bundled bmad-loop fork (1.9) and the uv bootstrap (1.8)" }, { epic = 4, needs = "the board, ticket detail, TicketStorePort with mark and the live index, through its sweep (4.12); the release after 4.13" }, { epic = 10, needs = "the BMad pieces contract, requireBmadFeature, the piece route helper and piece registration (10.2), and 10.6's architecture test (5.3)" }]

[[epic]]
id = 11
slug = "epic-build-runs-and-notifications"
title = "Watch every build, build all that's ready, and hear when one needs you"
covers = ["CAP-8", "CAP-9", "CAP-10", "CAP-14"]
after = [{ epic = 5, needs = "its contracts, stubs and fixtures for both halves (5.3), worktrees (5.5), the Build dialog (5.6), the dispatcher (5.8) and the review page (5.9), through its sweep (5.10); the release after 5.11" }, { epic = 10, needs = "the Runs tab slot (10.6)" }]

[[epic]]
id = 6
slug = "epic-every-agent"
title = "Add Antigravity beside Claude Code, if possible"
covers = ["CAP-15", "CAP-3", "CAP-5", "CAP-16"]
after = [{ epic = 2, needs = "the AgentPort contract, chat use-cases, permission cards, resume and the status sidebar, through its release (2.13)" }, { epic = 9, needs = "AgentSetupPort, install from pins, sign-in, the API key path and Welcome, through its release (9.7)" }, { epic = 3, needs = "terminal availability per agent (3.7) and the Windows terminal work (3.8)" }, { epic = 10, needs = "the pieces guard and 10.6's simple-project test" }, { epic = 4, needs = "BMad setup (4.3) and planning sessions (4.6)" }]

[[epic]]
id = 7
slug = "epic-retrospectives"
title = "Each finished epic teaches the next one"
covers = ["CAP-13"]
after = [{ epic = 5, needs = "finished, approved and merged runs with build records (5.9)" }]

# ---- v2 (planned; outside the v1 initiative's Done when) ----

[[epic]]
id = 8
slug = "epic-v2-developer-experience"
title = "Developers review and navigate their project without leaving Ogden Agents (v2)"
covers = []
after = [{ epic = 5, needs = "the review page and approve (5.9)" }, { epic = 6, needs = "for its agent work (V4): the agent registry, acp-base, the agent list and the picker, built on a go or a no-go" }]
