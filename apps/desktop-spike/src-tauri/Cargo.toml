# SPIKE 13.1 (temporary): a minimal Tauri shell that runs Ogden's packed server
# on a bundled Node. Reference for 13.2's real `packages/desktop/`; not shipped.
[package]
name = "ogden-desktop-spike"
version = "0.0.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-updater = "=2.12.0"
serde_json = "1"
ureq = { version = "2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
win32job = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
