[package]
name = "ogden-agents-desktop"
version = "2026.10.7-1"
description = "Ogden Agents as a desktop app: a Tauri shell around the local server on a bundled Node."
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "ogden-agents"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.12.0"
sha2 = "0.10"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
win32job = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
